syntax = "proto3";

// Structure-aware fuzzing schema for `json_ast_sql_parser_fuzzer`.
//
// A `Node` mirrors one object of the native ClickHouse JSON AST representation
// (`IAST::writeJSON` / `IAST::createFromJSON`): the `type` discriminator, the
// generic `children` array and an open list of named properties. Property keys
// and enumeration-like string values are protobuf enums, so libprotobuf-mutator
// only ever produces names that the `readJSON` implementations know about,
// while the value kind of every property is chosen independently through a
// `oneof` (the same JSON key has different value kinds in different node types,
// e.g. `value`, `cluster`, `settings`, `database`, `table`).
//
// Text mapping (see `JSONASTProtoConverter.cpp`):
// - `Key` identifiers are the JSON key with a `K_` prefix (`K_alias` -> `alias`).
// - `NodeType`, `FieldType` and `KnownString` values carry the exact JSON text in
//   the `(json_text)` option, because several of them differ only in case or
//   contain spaces, which protobuf enum identifiers cannot express.
//
// When a `readJSON` implementation starts reading a new key or accepting a new
// string constant, append it here (never renumber existing values, the binary
// corpus depends on the numbers). `json_ast_seed_converter` fails loudly on a
// JSON key or node type that is missing from this schema.

package json_ast_fuzzer;

import "google/protobuf/descriptor.proto";

extend google.protobuf.EnumValueOptions
{
    string json_text = 50000;
}

message Node
{
    NodeType type = 1;
    repeated Node children = 2;
    repeated Property props = 3;
}

message Property
{
    Key key = 1;
    oneof value
    {
        bool bool_value = 2;
        int64 int_value = 3;
        uint64 uint_value = 4;
        double double_value = 5;
        string string_value = 6;
        KnownString known_string = 7;
        Node node_value = 8;
        NodeList node_list = 9;
        FieldValue field_value = 10;
        StringList string_list = 11;
        Object object_value = 12;
        ObjectList object_list = 13;
        bool null_value = 14;
        FunctionName function_name = 15;
        SettingName setting_name = 16;
    }
}

// A JSON object that is not an AST node (it has no `type`), e.g. `server_type`
// and the elements of `changes`, `targets`, `elements`, `values`, `query_parameters`.
message Object
{
    repeated Property props = 1;
}

message ObjectList
{
    repeated Object items = 1;
}

message NodeList
{
    repeated Node items = 1;
}

message StringItem
{
    oneof value
    {
        string raw = 1;
        KnownString known = 2;
    }
}

message StringList
{
    repeated StringItem items = 1;
}

// `{"field_type": ..., "value": ...}` - the JSON encoding of a `Field`
// (see `JSONObjectWriter::writeFieldValue` and `JSONObjectReader::readFieldFromObject`).
message FieldValue
{
    FieldType field_type = 1;
    oneof value
    {
        bool null_value = 2;
        bool bool_value = 3;
        int64 int_value = 4;
        uint64 uint_value = 5;
        double double_value = 6;
        string string_value = 7;
        FieldList elements = 8;
    }
}

message FieldList
{
    repeated FieldValue items = 1;
}

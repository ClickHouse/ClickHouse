syntax = "proto2";

package DB.PulsarProto;
option optimize_for = LITE_RUNTIME;

/// Views of `MessageMetadata` and `SingleMessageMetadata` from `PulsarApi.proto` (same field numbers and wire types)
/// with only the singular fields that the client reads. They are written by producers, and parsing their repeated
/// fields would allocate one object per element; here every other field stays an unknown field kept as raw bytes.
/// Strings are declared as `bytes` (the same wire type), so that they are not validated as UTF-8.

message MessageMetadataView {
    optional uint64 publish_time = 3;
    optional bytes partition_key = 6;
    /// `CompressionType`, declared as an integer so that an unknown codec is rejected instead of read as `NONE`.
    optional int32 compression = 8;
    optional uint32 uncompressed_size = 9;
    optional int32 num_messages_in_batch = 11;
    optional uint64 event_time = 12;
    /// `repeated EncryptionKeys`: only its presence is used.
    optional bytes encryption_keys = 13;
    optional bytes ordering_key = 18;
    optional bytes uuid = 26;
    optional int32 num_chunks_from_msg = 27;
    optional int32 total_chunk_msg_size = 28;
    optional int32 chunk_id = 29;
}

message SingleMessageMetadataView {
    optional bytes partition_key = 2;
    optional int32 payload_size = 3;
    optional uint64 event_time = 5;
    optional bytes ordering_key = 7;
}

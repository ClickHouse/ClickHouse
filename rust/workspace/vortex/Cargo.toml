[package]
edition = "2021"
name = "_ch_rust_vortex"
version = "0.1.0"

[dependencies]
# Has to stay whatever version `vortex` itself pulls in, 
# or Arrow data would need converting on the way between the two crates.
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
async-task = "4.7"
concurrent-queue = "2"
futures = "0.3"
parking = "2"
kanal = "0.1"
vortex = { version = "0.83.0", default-features = false, features = ["files", "zstd"] }

[lib]
crate-type = ["staticlib"]

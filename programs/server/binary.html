<html>
<head>

    <title>ClickHouse Binary Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style type="text/css">
        html, body, #space {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        #space {
            background: #111;
            image-rendering: pixelated;
        }

        #error {
            display: none;
            position: absolute;
            z-index: 1001;
            bottom: max(5%, 1em);
            left: 50%;
            transform: translate(-50%, 0);
            background: #300;
            color: white;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 16pt;
            padding: 1em;
            min-width: 50%;
            max-width: 80%;
        }

        .leaflet-fade-anim .leaflet-popup {
            transition: none;
            font-family: monospace;
        }

        .leaflet-control-attribution {
            font-size: 12pt;
        }
    </style>
</head>

<body>
    <div id="space"></div>
    <div id="error"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        let host = 'http://localhost:8123/';
        let user = '';
        let password = '';
        let add_http_cors_header = true;

        /// The address of the server that served this page: the default connection, also used when a host
        /// hands a connection over without a `url` (see `applyConnectionFromHost`).
        ///
        /// The path of that address belongs to the endpoint rather than being decoration: it is sent
        /// verbatim with every request, and a reverse proxy can expose the server as
        /// `https://proxy.example/clickhouse/`, in which case this page is served as
        /// `https://proxy.example/clickhouse/binary` while `https://proxy.example/` is an unrelated site.
        /// Defaulting to `location.origin` would aim every query at that unrelated root. The built-in pages
        /// are attached as non-strict paths (`attachNonStrictPath` in `HTTPHandlerFactory`), so the served
        /// URL may carry a suffix - `/binary/`, `/binary?user=x` - and the prefix is therefore taken as
        /// everything up to and including the last `/` before the route name.
        function defaultServerAddress() {
            if (location.protocol == 'file:') return 'http://localhost:8123/';
            const url = new URL(location.href);
            url.search = '';
            url.hash = '';
            const route = url.pathname.lastIndexOf('/binary');
            if (route != -1) url.pathname = url.pathname.slice(0, route + 1);
            return url.href;
        }

        /// If it is hosted on server, assume that it is the address of ClickHouse.
        if (location.protocol != 'file:') {
            host = defaultServerAddress();
            add_http_cors_header = false;
        }

        if (window.location.search) {
            const params = new URLSearchParams(window.location.search);
            if (params.has('host')) { host = params.get('host'); }
            if (params.has('user')) { user = params.get('user'); }
            if (params.has('password')) { password = params.get('password'); }
        }

        function buildURL() {
            /// The configured address can already carry a query string - `?database=db`, or a proxy
            /// route selecting a cluster or a namespace - both when it comes from `?host=` and when a
            /// host page hands it over. Start the parameters below with `&` in that case instead of a
            /// second `?`, exactly like `play.html` and `docs.html`: a second `?` is not a separator,
            /// so `allow_introspection_functions` would be folded into the value of the last existing
            /// parameter and the request would go to a different endpoint than the one configured.
            const separator = host.indexOf('?') >= 0 ? '&' : '?';
            let result = `${host}${separator}allow_introspection_functions=1`;

            if (add_http_cors_header) {
                result += '&add_http_cors_header=1';
            }

            if (user) {
                result += `&user=${encodeURIComponent(user)}`;
            }
            if (password) {
                result += `&password=${encodeURIComponent(password)}`;
            }

            return result;
        }

        let url = buildURL();

        let map = L.map('space', {
            crs: L.CRS.Simple,
            center: [-512, 512],
            maxBounds: [[512, -512], [-1536, 1536]],
            zoom: 0,
        });

        let cached_tiles = {};
        /// Every request captures this value. A connection handover increments it, so late
        /// responses from the former server cannot populate the new cache or repaint the map.
        let connection_generation = 0;

        async function render(coords, tile) {
            const generation = connection_generation;
            const sql = `
                WITH
                    bitShiftLeft(1::UInt64, 5 - {z:UInt8})::UInt64 AS zoom_factor,

                    number MOD 1024 AS tile_x,
                    number DIV 1024 AS tile_y,

                    (zoom_factor * (tile_x + {x:UInt16} * 1024))::UInt16 AS x,
                    (zoom_factor * (tile_y + {y:UInt16} * 1024))::UInt16 AS y,

                    hilbertEncode(x, y) DIV 2 AS addr,

                    replaceOne(
                        replaceRegexpOne(
                            demangle(addressToSymbol(addr)),
                            '^([\\w\\*]+ )+', -- simple return types
                            ''),
                        '(anonymous namespace)::',
                        '') AS full_name,

                    extract(full_name, '(?:(?:DB|std|__1|detail|impl_?)::)?(\\w+)') AS name,
                    (empty(name) ? 0 : sipHash64(name)) AS hash,
                    hash MOD 256 AS r, hash DIV 256 MOD 256 AS g, hash DIV 65536 MOD 256 AS b

                SELECT r::UInt8, g::UInt8, b::UInt8
                FROM numbers_mt(1024*1024)
                ORDER BY number`;

            const key = `${coords.z}-${coords.x}-${coords.y}`;
            let buf = cached_tiles[key];
            if (!buf) {
                let request_url = `${url}&default_format=RowBinary` +
                    `&param_z=${coords.z}&param_x=${coords.x}&param_y=${coords.y}` +
                    `&enable_http_compression=1&network_compression_method=zstd&network_zstd_compression_level=6`;

                const response = await fetch(request_url, { method: 'POST', body: sql });

                if (generation != connection_generation) return;

                if (!response.ok) {
                    const text = await response.text();
                    if (generation != connection_generation) return;
                    let err = document.getElementById('error');
                    err.textContent = text;
                    err.style.display = 'block';
                    return;
                }

                buf = await response.arrayBuffer();
                if (generation != connection_generation) return;
                cached_tiles[key] = buf;
            }

            if (generation != connection_generation) return;

            let ctx = tile.getContext('2d');
            let image = ctx.createImageData(1024, 1024);
            let arr = new Uint8ClampedArray(buf);

            for (let i = 0; i < 1024 * 1024; ++i) {
                image.data[i * 4 + 0] = arr[i * 3 + 0];
                image.data[i * 4 + 1] = arr[i * 3 + 1];
                image.data[i * 4 + 2] = arr[i * 3 + 2];
                image.data[i * 4 + 3] = 255;
            }

            ctx.putImageData(image, 0, 0, 0, 0, 1024, 1024);

            let err = document.getElementById('error');
            err.style.display = 'none';
        }

        L.GridLayer.ClickHouse = L.GridLayer.extend({
            createTile: function(coords, done) {
                let tile = L.DomUtil.create('canvas', 'leaflet-tile');
                tile.width = 1024;
                tile.height = 1024;
                if (coords.x < 0 || coords.y < 0 || coords.x >= Math.pow(2, coords.z) || coords.y >= Math.pow(2, coords.z)) return tile;
                render(coords, tile).then(err => done(err, tile));
                return tile;
            }
        });

        let layer = new L.GridLayer.ClickHouse({
            tileSize: 1024,
            minZoom: 0,
            maxZoom: 10,
            minNativeZoom: 0,
            maxNativeZoom: 5,
            attribution: '© ClickHouse, Inc.'
        });

        layer.addTo(map);

        map.attributionControl.setPrefix('<a href="https://github.com/ClickHouse/ClickHouse/">About</a>');

        function latLngToPixel(latlng) {
            return { x: ((latlng.lng / 1024) * 32768)|0, y: ((-latlng.lat / 1024) * 32768)|0 };
        }

        function pixelToLatLng(pixel) {
            return { lat: (-pixel.y - 0.5) / 32768 * 1024, lng: (pixel.x + 0.5) / 32768 * 1024 };
        }

        let popup = L.popup({maxWidth: '100%'});
        let current_requested_addr = '';

        function updateHistory() {
            const state = {
                zoom: map.getZoom(),
                center: latLngToPixel(map.getCenter()),
            };

            /// Keep the parameters that are not related to the position, such as host and user.
            const params = new URLSearchParams(window.location.search);

            /// The password is already saved in `url` at startup, and it should not be kept in the address bar or in the browser history.
            params.delete('password');

            params.set('zoom', state.zoom);
            params.set('x', state.center.x);
            params.set('y', state.center.y);

            if (popup.isOpen() && map.getBounds().contains(popup.getLatLng())) {
                state.popup = latLngToPixel(popup.getLatLng());
                params.set('px', state.popup.x);
                params.set('py', state.popup.y);
            } else {
                params.delete('px');
                params.delete('py');
            }

            history.replaceState(state, '', `?${params}`);
        }

        window.onpopstate = function(event) {
            const state = event.state;
            if (!state) {
                return;
            }

            map.setView(pixelToLatLng(state.center), state.zoom);

            if (state.popup) {
                showPopup(state.popup.x, state.popup.y);
            }
        };

        if (window.location.search) {
            const params = new URLSearchParams(window.location.search);

            /// Move the view only if the position is specified, otherwise keep the default centered view.
            if (params.has('x') && params.has('y')) {
                map.setView(
                    pixelToLatLng({x: params.get('x')|0, y: params.get('y')|0}),
                    params.has('zoom') ? params.get('zoom')|0 : map.getZoom());
            }

            if (params.has('px') && params.has('py')) {
                showPopup(params.get('px')|0, params.get('py')|0);
            }
        }

        function hilbertEncode(x, y) {
            let xn = BigInt(x);
            let yn = BigInt(y);

            let res = 0n;

            for (let shift = 0n; shift < 16n; ++shift) {
                const mask = 1n << (15n - shift);
                const x_bit = (xn & mask) > 0n ? 1n : 0n;
                const y_bit = (yn & mask) > 0n ? 1n : 0n;

                res += mask * mask * ((3n * y_bit) ^ x_bit);

                if (x_bit == 0n) {
                    if (y_bit == 1n) {
                        xn = mask - 1n - xn;
                        yn = mask - 1n - yn;
                    }
                    [xn, yn] = [yn, xn];
                }
            }

            return res;
        }

        function showPopup(x, y) {
            const generation = connection_generation;
            let addr_int = hilbertEncode(x, y) / 2n;

            current_requested_addr = addr_int;

            const addr_hex = '0x' + addr_int.toString(16);
            const response = fetch(
                `${url}&default_format=JSON`,
                {
                    method: 'POST',
                    body: `SELECT encodeXMLComponent(demangle(addressToSymbol(${addr_int}::UInt64))) AS name,
                                  encodeXMLComponent(addressToLine(${addr_int}::UInt64)) AS line`
                }).then(response => response.json().then(o => {

                    let name = o.rows ? o.data[0].name : 'nothing';
                    let line = o.rows ? o.data[0].line : '';

                    if (generation == connection_generation && addr_int == current_requested_addr) {
                        popup.setContent(`<p><b>${addr_hex}</b></p><p>${name}</p><p>${line}</p>`);
                    }
                }));

            popup
                .setLatLng(pixelToLatLng({x: x, y: y}))
                .setContent(addr_hex)
                .openOn(map);
        }

        map.on('click', e => {
            const {x, y} = latLngToPixel(e.latlng);
            if (x < 0 || x >= 32768 || y < 0 || y >= 32768) return;

            showPopup(x, y);
            updateHistory();
        });

        map.on('moveend', e => updateHistory());

        /// The connection over `postMessage`.
        ///
        /// When this page is opened from another built-in web UI page or embedded in an iframe, the
        /// host hands the connection over in a message instead of the query string, because a
        /// password in a URL leaks into browser history, referrer headers, server access logs and
        /// proxy logs. This page announces itself with `clickhouse-hello` and the host answers with
        /// `clickhouse-credentials`; see `play.html`, which documents the protocol and implements
        /// the other side of it.

        /// Origins allowed to hand a connection to this page: its own origin - one built-in page opening
        /// another, the way `/play` opens `/docs` - and the ClickHouse Cloud consoles, which embed these
        /// pages in an iframe. The list is exact rather than a domain suffix: every Cloud service endpoint
        /// is a `*.clickhouse.cloud` host serving content of its owner's choosing, and a trusted host can
        /// aim this page at a server of its own through `url`, which the user may then type their
        /// credentials into believing it is still their own service.
        const TRUSTED_HOST_ORIGINS = [
            'https://console.clickhouse.cloud',
            'https://console.clickhouse-staging.com',
            'https://clickhouse.com',
        ];
        function isTrustedHostOrigin(origin) {
            /// A browser-supplied `event.origin` is normalized (lower case, default port omitted), so the
            /// origins above can be compared literally.
            return origin === window.location.origin || TRUSTED_HOST_ORIGINS.includes(origin);
        }

        /// Adopt a connection handed over by the host page and redraw the map from the new server.
        /// The cached tiles belong to the previous server's binary, so they are dropped.
        ///
        /// `url` is optional and defaults to the one already configured; the credentials are always
        /// replaced wholesale, so that none of them can outlive the connection they belong to.
        function applyConnectionFromHost(data) {
            ++connection_generation;
            if (data.url !== undefined) {
                host = data.url;
                /// The handed-over server may be a different origin than this page's, and the
                /// server adds `Access-Control-Allow-Origin` to its responses only when asked to.
                add_http_cors_header = true;
            }
            user = data.user || '';
            password = data.password || '';
            url = buildURL();
            cached_tiles = {};
            layer.redraw();
            /// A symbol popup that already rendered keeps showing the former server's binary: the
            /// generation checks above only stop a *late* response from repainting, they do nothing to
            /// content that arrived in time. Re-request it under the new connection, so the page never
            /// shows one server's map together with another server's symbol. The coordinates are the
            /// user's selection and stay as they are; `showPopup` repaints the address immediately and
            /// fills in the symbol when the new server answers.
            if (popup.isOpen()) {
                const position = latLngToPixel(popup.getLatLng());
                showPopup(position.x, position.y);
            }
        }

        {
            /// The window that opened this page, or the one embedding it; a page has at most one host.
            const host_window = window.opener || (window.parent !== window ? window.parent : null);
            if (host_window) {
                window.addEventListener('message', event => {
                    if (event.source !== host_window) return;
                    if (!isTrustedHostOrigin(event.origin)) return;
                    if (!event.data || event.data.type !== 'clickhouse-credentials') return;
                    applyConnectionFromHost(event.data);
                });
                /// Broadcast, because the host's location cannot be read cross-origin. The message
                /// carries no secrets - only the fact that this page exists, which the host knows.
                host_window.postMessage({type: 'clickhouse-hello'}, '*');
            }
        }
    </script>
</body>
</html>

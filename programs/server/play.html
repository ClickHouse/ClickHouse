        if (use_framing && !response.ok && !content_type.startsWith('text/event-stream') && await queryIsReadOnly(query)) {
            use_framing = false;
            response = await fetch(url, fetch_options);
            content_type = response.headers.get('Content-Type') ?? '';
        }

        /// A framed error stream is read in full before dispatching on it: when the exception is
        /// the framing rejecting the query's own output format (an explicit `FORMAT
        /// JSONEachRowWithProgress` or `FORMAT Template` - formats the framing does not accept),
        /// the same query succeeds without framing, so retry it plain (read-only queries only, as
        /// above). The rejection is recognized by its message; the substring is pinned by
        /// `04512_framing_formats.sh`. Any other framed error stream is replayed below, rendering
        /// the partial data, the logs, and the exception.
        let framed_error_stream = null;
        if (!response.ok && content_type.startsWith('text/event-stream')) {
            framed_error_stream = await response.text();
            if (posted_request_num != request_num) { return { cancelled: true }; }
            if (use_framing && await queryIsReadOnly(query) && framed_error_stream.includes('is not compatible with framing formats')) {
                framed_error_stream = null;
                use_framing = false;
                response = await fetch(url, fetch_options);
                content_type = response.headers.get('Content-Type') ?? '';
            }
        }

        format = response.headers.get('X-ClickHouse-Format') ?? default_format;

        /// An image output format (`PNG`) is detected by the `X-ClickHouse-Format` header as well as
        /// by the `Content-Type`: with a framing format the `Content-Type` is `text/event-stream`, so
        /// it no longer reveals the output format.
        const image_mime = imageMimeForFormat(format);

        /// For any streaming (framing) query, show the result/logs switcher up front - regardless of
        /// the outcome - so the server logs streamed before a failure stay reachable and the Logs
        /// button is present in the case of an exception too.
        if (use_framing) {
            targetResultEl.enableViews();
        }

        if (!response.ok && content_type.startsWith('text/event-stream')) {
            /// A framing `EventStream` response carries the exception as the last packet even on an
            /// HTTP error status, along with any data and logs produced before it. Replay the whole
            /// stream (already read above, when checking for a format-compatibility rejection):
            /// it renders the partial result, the logs, and the exception.
            is_error = true;
            const base64 = content_type.includes('payload=base64');
            is_base64 = base64;
            renderEventStreamText(framed_error_stream, targetResultEl, !base64 && !isDefaultFormat(format), base64, image_mime);
            reply = framed_error_stream;
            return { format, reply, response_ok: false, is_table, is_raw, is_chart, is_image, is_error, is_base64 };
        } else if (!response.ok) {
            is_error = true;
            reply = await response.text();
            if (posted_request_num != request_num) { return { cancelled: true }; }

            let has_exception = false;
            for (const line of reply.split('\n')) {
                if (line.startsWith(`{"exception":`)) {
                    targetResultEl.update(JSON.parse(line));
                    has_exception = true;
                    break;
                }
            }
            if (!has_exception) {
                targetResultEl.renderError(reply);
            }

            /// If the error message points at a position in the query (e.g. a syntax error),
            /// highlight that position in the editor -- unless the user has returned to the editor
            /// since this run started, in which case this response is stale and must not repaint.
            if (editorInteractionGen === runEditorInteraction) {
                highlightQueryError(reply, query, queryStart);
            }

            return { format, reply, response_ok: false, is_table, is_raw, is_chart, is_image, is_error, is_base64 };
        } else if ((content_type.startsWith('image/') || image_mime) && !content_type.startsWith('text/event-stream')) {
            /// A non-framed image response: the whole body is the image. (A framed image response is
            /// an event stream and is handled below, where the base64 payload is decoded to bytes.)
            is_image = true;
            /// Use the format's MIME type when the response `Content-Type` does not carry it.
            const blob = image_mime && !content_type.startsWith('image/')
                ? new Blob([await response.arrayBuffer()], { type: image_mime })
                : await response.blob();
            if (posted_request_num != request_num) { return { cancelled: true }; }
            targetResultEl.renderImage(blob);
        } else if (content_type.startsWith('text/event-stream')) {
            /// The framing `EventStream` format: data/totals/extremes packets carry the bytes of the
            /// output format; progress, log, and profile-event packets drive the progress indicator,
            /// the logs view, and the realtime resource meters. The payload is line-delimited JSON
            /// parsed into a table for the default format; raw text for another text format; or, when
            /// the content type carries `payload=base64` (a binary or raw output format), base64 that
            /// is decoded and rendered as an image or raw text.
            const base64 = content_type.includes('payload=base64');
            is_base64 = base64;
            const raw_text = !base64 && !isDefaultFormat(format);
            const res = await readEventStream(response, targetResultEl, abortController, posted_request_num, raw_text, base64, image_mime);
            if (res.cancelled) { return { cancelled: true }; }
            if (base64) { if (res.is_image) is_image = true; else is_raw = true; }
            else if (raw_text) is_raw = true; else is_table = true;
            reply = res.reply;
            /// An `exception` packet can arrive after the HTTP status was already sent as 200 OK
            /// (the headers go out once streaming begins). Report the failure to the caller, so the
            /// single-query path shows the error state and `Run all` does not execute the following
            /// statements after this one failed. The stream was rendered above: the partial result,
            /// the logs, and the exception are all shown.
            if (res.exception) {
                is_error = true;
                return { format, reply, response_ok: false, is_table, is_raw, is_chart, is_image, is_error, is_base64 };
            }
        } else if (format == default_format) {
            is_table = true;
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            let buffer = '';
            while (true) {
                const { done, value } = await reader.read();
                if (posted_request_num != request_num) { return { cancelled: true }; }
                if (done) break;

                let new_content = decoder.decode(value, { stream: true });
                buffer += new_content;
                reply += new_content;

                let lines = buffer.split('\n');
                let fragment = document.createDocumentFragment();

                let cont = true;
                for (const line of lines.slice(0, -1)) {
                    const data = JSON.parse(line);
                    cont = targetResultEl.update(data, fragment);
                    if (!cont) { break; }
                }

                targetResultEl.flushFragment(fragment);

                if (!cont)
                {
                    abortController.abort();
                    break;
                }
                buffer = lines[lines.length - 1];
            }
        } else if (format == 'JSONCompactColumns') {
            is_chart = true;
            reply = await response.text();
            if (posted_request_num != request_num) { return { cancelled: true }; }
            /// Await the chart render and let it bail inside (after the uPlot load, before
            /// touching the DOM) if a tab switch superseded this request meanwhile.
            await targetResultEl.renderChart(JSON.parse(reply), () => posted_request_num === request_num);
        } else {
            is_raw = true;
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            /// A query that carries its own `JSONEachPacket*` framing (the NDJSON framings the page
            /// does not render specially) streams its packet lines verbatim here. The lines are still
            /// shown as-is, but they are scanned for a `{"packet":"exception",...}` line: a query can
            /// fail after data was already streamed and the `200 OK` header sent, ending the stream
            /// with an `exception` packet while the HTTP status stays `200`. Report that as a failure
            /// so the single run shows the error state and `Run all` stops, mirroring the framed
            /// `EventStream` path above. The exact packet form is pinned by
            /// `04548_play_ui_framing_fallbacks.sh`. Plain raw output produced after a framing retry
            /// (`use_framing` turned off, `user_framing` false) is not scanned - it has no packets.
            const scan_packets = user_framing;
            const exception_prefix = '{"packet":"exception"';
            let saw_exception = false;
            /// The first characters of the current line, capped at the prefix length: a line either
            /// begins with the exception packet or not, so only the head is needed (this keeps the
            /// scan bounded regardless of how large a single data packet line is).
            let line_head = '';

            const scanForException = (chunk) => {
                if (!scan_packets || saw_exception) return;
                for (let i = 0; i < chunk.length; ++i) {
                    const c = chunk[i];
                    if (c === '\n') { line_head = ''; continue; }
                    if (line_head.length < exception_prefix.length) {
                        line_head += c;
                        if (line_head === exception_prefix) { saw_exception = true; return; }
                    }
                }
            };

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                let new_content = decoder.decode(value, { stream: true });
                reply += new_content;

                if (posted_request_num != request_num) { return { cancelled: true }; }
                targetResultEl.updateRaw(new_content);
                scanForException(new_content);
            }

            if (saw_exception) {
                is_error = true;
                return { format, reply, response_ok: false, is_table, is_raw, is_chart, is_image, is_error, is_base64 };
            }
        }

        if (targetResultEl.isExplainGraph) {
            /// Bail inside renderGraph (after the Viz load, before mutating the DOM) if a tab
            /// switch superseded this request during the load. Kept inside the `try` so a Viz
            /// loader failure (like the uPlot one for charts) is reported as a normal error.
            await targetResultEl.renderGraph(() => posted_request_num === request_num);
        } else {
            /// Render totals before coloring, so the totals row (which `_colorTargetRows`
            /// includes) is colored on the first paint too.
            if (is_table) targetResultEl.renderTotals();
            targetResultEl.applyColumnColors();
            if (is_table) targetResultEl.transposeIfNeeded();
        }

        /// A tab switch during an awaited renderer (chart/graph loader) makes the render bail
        /// without painting; report cancellation too, so the caller does not then update the
        /// now-active tab's shared progress/download/history state for this stale run.
        if (posted_request_num != request_num) { return { cancelled: true }; }

        return { format, reply, response_ok: true, is_table, is_raw, is_chart, is_image, is_error, is_base64 };
    } catch (e) {
        if (posted_request_num != request_num) { return { cancelled: true }; }

        console.log(e);
        if (e instanceof TypeError) {
            reply = "Network error";
        } else if (e.name === 'AbortError') {
            reply = "Query was cancelled";
        } else {
            reply = e.toString();
        }
        targetResultEl.renderError(reply);
        return { format, reply, response_ok: false, is_table: false, is_raw: false, is_chart: false, is_image: false, is_error: true };
    }
}

/// Execute a single query (legacy path, used for single-query mode).
/// When `history_query_text` is provided, it overrides `query` for browser history/URL storage,
/// preserving the full textarea content when running a selected query in multi-query mode.
async function postSingle(posted_request_num, query, history_query_text, params_restore_pending, queryStart)
{
    const paramValuesSnapshot = resolveRunParams(params_restore_pending);
    last_query_start = performance.now();

    document.getElementById('download-div').style.display = 'none';
    document.getElementById('copy-div').style.display = 'none';

    clear();
    progressEl.start();

    controller = new AbortController();
    const result = await postImpl(posted_request_num, query, resultEl, controller, paramValuesSnapshot, queryStart);

    if (result.cancelled) return;

    if (result.is_error || !result.response_ok) {
        logoEl.style.display = 'none';
        progressEl.clear();
        document.getElementById('download-div').style.display = 'none';
        document.getElementById('copy-div').style.display = 'none';
        /// Persist the error as this tab's result snapshot. The restore path renders an
        /// `ok: false` snapshot as the exception, so switching away/back or reloading shows
        /// the failed query's error; without this, the failed run leaves the tab's previous
        /// successful result in place and that stale result would resurrect under the failed
        /// query. Guarded on the request number like the success path below (and like
        /// `postMulti`), so a superseded run (tab switch / newer run) does not overwrite the
        /// now-active tab's snapshot.
        if (posted_request_num == request_num) {
            saveHistory({
                query: history_query_text || query,
                resultQuery: query,
                format: result.format,
                ok: result.response_ok,
                data: result.reply.length > 100000 ? null : result.reply,
                base64: result.is_base64,
                elapsed_ns: 1e6 * (performance.now() - last_query_start),
                params: paramValuesSnapshot,
            });
        }
        return;
    }

    /// `postImpl` already performed `renderGraph`/`applyColumnColors`/`renderTotals`/`transposeIfNeeded`;
    /// the only step specific to the single-query path is the final table layout pass.
    if (result.is_table) resultEl._changeTableLayout();

    progressEl.finish();
    document.getElementById('download-div').style.display = 'block';
    document.getElementById('copy-div').style.display = result.is_raw ? 'block' : 'none';
    last_query_for_download = query;
    last_params_for_download = paramValuesSnapshot;

    if (result.is_raw || result.is_image) {
        resultEl.elapsedNs = 1e6 * (performance.now() - last_query_start);
        elapsed_ns = resultEl.elapsedNs;
    } else {
        elapsed_ns = resultEl.elapsedNs;
    }

    progressEl.updateText(resultEl.rowCount, resultEl.elapsedNs, resultEl.incompleteResult);
    progressEl.style.setProperty('--progress', '0%');
    document.documentElement.style.setProperty('--background-color-rotate', queryToColor(query));

    if (posted_request_num != request_num) { return; }

    /// Persist the result snapshot on the active tab and record an entry in browser
    /// history + the URL. In multi-query "Run selected" mode `history_query_text` carries
    /// the full editor content (the editor text + URL), while `resultQuery` is the single
    /// statement that actually produced this result (used for rendering and downloads).
    /// The per-column color coding modes travel with the snapshot (see `saveHistory`).
    saveHistory({
        query: history_query_text || query,
        resultQuery: query,
        format: result.format,
        ok: result.response_ok,
        data: result.reply.length > 100000 ? null : result.reply,
        base64: result.is_base64,
        elapsed_ns: elapsed_ns,
        params: paramValuesSnapshot,
    });
}

/// Container for dynamically created result elements in multi-query mode.
let multiQueryContainer = null;
/// Array of AbortControllers for all in-flight queries in multi-query mode.
let multiQueryControllers = [];

/// Execute multiple queries with parallelization of consecutive SELECTs.
/// `parsed` is an array of { query, is_select } objects from splitAllQueries.
async function postMulti(posted_request_num, parsed, params_restore_pending)
{
    const paramValuesSnapshot = resolveRunParams(params_restore_pending);
    last_query_start = performance.now();

    document.getElementById('download-div').style.display = 'none';
    document.getElementById('copy-div').style.display = 'none';

    clear();
    progressEl.start();

    /// Hide the default single result element and the logo.
    resultEl.style.display = 'none';
    logoEl.style.display = 'none';

    /// Create a container for multiple results if it doesn't exist.
    if (!multiQueryContainer) {
        multiQueryContainer = document.createElement('div');
        multiQueryContainer.id = 'multi-query-results';
        resultEl.parentElement.insertBefore(multiQueryContainer, resultEl);
    }
    multiQueryContainer.innerHTML = '';
    multiQueryContainer.style.display = 'block';
    multiQueryControllers = [];

    /// Create result elements for each query.
    const resultElements = [];
    for (let i = 0; i < parsed.length; ++i) {
        const el = document.createElement('query-result');
        multiQueryContainer.appendChild(el);
        resultElements.push(el);
    }

    /// Track aggregated progress across all concurrent queries.
    const progressState = new Map(); /// query index -> { read_rows, read_bytes, total_rows, elapsed_ns }
    function updateAggregatedProgress() {
        let total_read_rows = 0, total_read_bytes = 0, total_total_rows = 0, max_elapsed_ns = 0;
        for (const [, p] of progressState) {
            total_read_rows += p.read_rows;
            total_read_bytes += p.read_bytes;
            total_total_rows += p.total_rows;
            max_elapsed_ns = Math.max(max_elapsed_ns, p.elapsed_ns);
        }
        progressEl.updateProgress({
            read_rows: String(total_read_rows),
            read_bytes: String(total_read_bytes),
            total_rows_to_read: String(total_total_rows),
            elapsed_ns: String(max_elapsed_ns),
        });
    }

    /// Listen for progress events from each result element.
    for (let i = 0; i < resultElements.length; ++i) {
        resultElements[i].addEventListener('query-progress', (e) => {
            progressState.set(i, {
                read_rows: +e.detail.read_rows,
                read_bytes: +e.detail.read_bytes,
                total_rows: +e.detail.total_rows_to_read,
                elapsed_ns: +e.detail.elapsed_ns,
            });
            updateAggregatedProgress();
        });
    }

    /// Group consecutive parallelizable queries together.
    /// Each group is either a batch of SELECTs (run in parallel) or a single non-SELECT (barrier).
    const groups = [];
    let current_group = null;
    for (let i = 0; i < parsed.length; ++i) {
        if (parsed[i].is_select) {
            if (!current_group || !current_group.parallelizable) {
                current_group = { parallelizable: true, indices: [] };
                groups.push(current_group);
            }
            current_group.indices.push(i);
        } else {
            current_group = { parallelizable: false, indices: [i] };
            groups.push(current_group);
        }
    }

    /// Execute groups sequentially; within a parallelizable group, execute all queries concurrently.
    /// Keep each statement's result so a small run can be snapshotted for restore (see below).
    let had_error = false;
    const collected = new Array(parsed.length).fill(null);
    for (const group of groups) {
        if (posted_request_num != request_num) return;
        if (had_error) break;

        const promises = group.indices.map(i => {
            const ac = new AbortController();
            multiQueryControllers.push(ac);
            return postImpl(posted_request_num, parsed[i].query, resultElements[i], ac, paramValuesSnapshot, parsed[i].queryStart)
                .then(result => ({ index: i, result }));
        });

        const results = await Promise.all(promises);

        for (const { index, result } of results) {
            if (result.cancelled) return;
            collected[index] = result;
            if (result.is_error || !result.response_ok) {
                had_error = true;
            }
        }
    }

    if (posted_request_num != request_num) return;

    /// Compute aggregated stats.
    let total_rows = 0;
    let max_elapsed_ns = 0;
    let any_incomplete = false;
    for (const el of resultElements) {
        total_rows += el.rowCount;
        max_elapsed_ns = Math.max(max_elapsed_ns, el.elapsedNs);
        if (el.incompleteResult) any_incomplete = true;
    }

    if (!had_error) {
        logoEl.style.display = 'block';
    }

    progressEl.finish();
    elapsed_ns = max_elapsed_ns || 1e6 * (performance.now() - last_query_start);
    progressEl.updateText(total_rows, elapsed_ns, any_incomplete);
    progressEl.style.setProperty('--progress', '0%');
    document.documentElement.style.setProperty('--background-color-rotate', queryToColor(parsed[0].query));

    if (posted_request_num != request_num) return;

    /// Snapshot the per-statement results so switching tabs / reloading restores the whole
    /// "Run all" output (not just the queries), the same way a single query's result is kept.
    /// Mirror the single-query 100 KB cap, but on the TOTAL size across all statements: above
    /// it we store no data (`multi: null`) and the run is query-only (re-running reproduces it).
    /// A non-framed image streams as a blob (its `reply` stays empty) and cannot be re-rendered
    /// from text, so it is stored with `data: null` and restores as empty, exactly like a single
    /// image. A framed image comes from an `EventStream` with a base64 payload, so its `reply`
    /// is a replayable snapshot (`renderEventStreamText` reconstructs the picture on restore)
    /// and is persisted like any other statement, the same way the single-query path keeps it.
    let multi = collected.map((r, i) => ({
        query: parsed[i].query,
        format: r ? r.format : null,
        ok: r ? !!r.response_ok : false,
        data: (r && (!r.is_image || r.is_base64)) ? r.reply : null,
        base64: r ? !!r.is_base64 : false,
    }));
    let multi_size = 0;
    for (const s of multi) multi_size += s.data ? s.data.length : 0;
    if (multi_size > 100000) multi = null;

    /// Save all queries to browser history, using the full textarea content.
    saveHistory({
        query: query_area.value,
        format: null,
        ok: !had_error,
        data: null,
        multi: multi,
        elapsed_ns: elapsed_ns,
        params: paramValuesSnapshot,
    }, parsed[0].query);
}

/// Render one saved multi-query statement snapshot into `el`, mirroring the live per-statement
/// rendering in `postImpl` (table / chart / EXPLAIN graph / raw / error), minus the streaming.
/// `token` guards the awaited chart/graph loaders: a superseding activation bails before touching
/// the DOM, and a loader failure (e.g. a blocked CDN) is shown as an error for that statement
/// rather than throwing out of the whole restore.
async function renderSnapshotIntoElement(el, snap, token) {
    el.queryText = snap.query;
    if (!snap.data) return;
    const format = snap.format;

    /// A framing `EventStream` snapshot (data, logs, progress, and possibly an exception, all
    /// multiplexed as server-sent events). Replay the whole stream, then finish like a table.
    /// A `base64` snapshot (binary or raw output format) is decoded to bytes and rendered as an
    /// image or raw text, mirroring the live path; it is never a table.
    if (snap.data.startsWith('event:')) {
        const base64 = !!snap.base64;
        const raw_text = !base64 && !isDefaultFormat(format);
        el.enableViews();
        renderEventStreamText(snap.data, el, raw_text, base64, imageMimeForFormat(format));
        if (el.isExplainGraph) {
            try {
                await el.renderGraph(() => token === request_num);
            } catch (e) {
                if (token !== request_num) return;
                console.log(e);
                el.renderError(e.toString());
            }
        } else if (!raw_text && !base64) {
            el.renderTotals();
            el.applyColumnColors();
            el.transposeIfNeeded();
        }
        return;
    }

    if (!snap.ok) {
        /// A failed query that carried its own `JSONEachPacket*` framing saved its raw packet stream
        /// (data, log, and progress packets ending with an `exception` packet) as `data`, not a
        /// plain `{"exception": ...}` error body. Replay it as raw text - the way the live run showed
        /// it (`updateRaw`) - instead of rendering the whole packet stream as one opaque error
        /// string, so the partial output and the exception packet stay visible. An NDJSON packet
        /// stream always begins with a `{"packet": ...}` object, which a plain error body never does
        /// (this mirrors the `event:`-prefix check above for `EventStream` snapshots).
        if (snap.data.startsWith('{"packet":')) {
            el.updateRaw(snap.data);
            return;
        }
        let has_exception = false;
        for (const line of snap.data.split('\n')) {
            if (line.startsWith(`{"exception":`)) {
                el.update(JSON.parse(line));
                has_exception = true;
                break;
            }
        }
        if (!has_exception) el.renderError(snap.data);
        return;
    }

    let is_table = false;
    if (format == default_format) {
        is_table = true;
        let fragment = document.createDocumentFragment();
        for (const line of snap.data.split('\n')) {
            if (line.length == 0) continue;
            if (!el.update(JSON.parse(line), fragment)) { break; }
        }
        el.flushFragment(fragment);
    } else if (format == 'JSONCompactColumns') {
        if (token !== request_num) return;
        try {
            await el.renderChart(JSON.parse(snap.data), () => token === request_num);
        } catch (e) {
            if (token !== request_num) return;
            console.log(e);
            el.renderError(e.toString());
            return;
        }
        if (token !== request_num) return;
    } else {
        el.updateRaw(snap.data);
    }

    if (el.isExplainGraph) {
        try {
            await el.renderGraph(() => token === request_num);
        } catch (e) {
            if (token !== request_num) return;
            console.log(e);
            el.renderError(e.toString());
            return;
        }
        if (token !== request_num) return;
    } else {
        /// Render totals before coloring, so the totals row (which `_colorTargetRows`
        /// includes) is colored on the first paint too.
        if (is_table) el.renderTotals();
        el.applyColumnColors();
        if (is_table) el.transposeIfNeeded();
    }
}

/// Persist the per-column color coding modes so reloads, shares, and Back/Forward keep them.
/// The modes belong to the active tab's displayed result, so record them on the tab's result
/// snapshot (persisted to IndexedDB and re-applied when the tab is re-activated) and re-stamp the
/// current history entry + URL in place, without creating a new record.
function persistColorModes() {
    const tab = getActiveTab();
    if (tab && tab.result) tab.result.color_modes = column_color_modes;
    const url = new URL(window.location);
    if (Object.keys(column_color_modes).length > 0) {
        url.searchParams.set('color_modes', JSON.stringify(column_color_modes));
    } else {
        url.searchParams.delete('color_modes');
    }
    /// Keep the tabs state shape: fold the modes into the entry's nested `result` when it has one
    /// (matching how `restoreFromHistory` reads them back via `state.result || state`), else at
    /// the top level for a legacy flat entry.
    const cur = history.state;
    if (cur) {
        const next = cur.result
            ? { ...cur, result: { ...cur.result, color_modes: column_color_modes } }
            : { ...cur, color_modes: column_color_modes };
        try {
            history.replaceState(next, document.title, url.toString());
        } catch (e) {
            /// History manipulation is not allowed for the 'file:' protocol.
        }
    }
    scheduleSave();
}

/// Re-render a saved multi-query ("Run all") result snapshot, rebuilding the multi-query
/// container the same way `postMulti` lays it out: one result element per statement, the single
/// result element and logo hidden, and aggregated progress text. Called from `restoreFromHistory`
/// for a tab whose result carries a `multi` array (small runs; large ones are query-only).
async function restoreMultiQuery(snapshot, token) {
    resultEl.style.display = 'none';
    logoEl.style.display = 'none';

    if (!multiQueryContainer) {
        multiQueryContainer = document.createElement('div');
        multiQueryContainer.id = 'multi-query-results';
        resultEl.parentElement.insertBefore(multiQueryContainer, resultEl);
    }
    multiQueryContainer.innerHTML = '';
    multiQueryContainer.style.display = 'block';

    const elements = [];
    for (let i = 0; i < snapshot.multi.length; ++i) {
        const el = document.createElement('query-result');
        multiQueryContainer.appendChild(el);
        elements.push(el);
    }

    for (let i = 0; i < snapshot.multi.length; ++i) {
        await renderSnapshotIntoElement(elements[i], snapshot.multi[i], token);
        if (token !== request_num) return;
    }

    /// The logo returns only for a fully successful run, matching the live `postMulti` path.
    if (!snapshot.multi.some(s => !s.ok)) logoEl.style.display = 'block';

    let total_rows = 0;
    let max_elapsed_ns = 0;
    let any_incomplete = false;
    for (const el of elements) {
        total_rows += el.rowCount;
        max_elapsed_ns = Math.max(max_elapsed_ns, el.elapsedNs);
        if (el.incompleteResult) any_incomplete = true;
    }

    progressEl.finish();
    elapsed_ns = snapshot.elapsed_ns || max_elapsed_ns;
    progressEl.updateText(total_rows, elapsed_ns, any_incomplete);
    progressEl.style.setProperty('--progress', '0%');
    document.documentElement.style.setProperty('--background-color-rotate', queryToColor(snapshot.multi[0].query));
}

/// `token` ties this render to one activation/history navigation (the value of
/// `request_num` at the time). After each await we bail if it changed, so a slow
/// activation cannot apply its state on top of a newer one.
async function restoreFromHistory(state, token) {
    if (token === undefined) token = request_num;
    /// The editor (textarea + param inputs) is restored from the top-level query/params.
    /// The result is rendered from `state.result`, which carries the query/params that
    /// produced it; for flat history entries (editor == result) it defaults to `state`.
    const result = state.result || state;
    /// Restore the per-column color coding modes saved with this result before rendering, so the
    /// table is colored on the first paint. Reads `result.color_modes`, which covers both nested
    /// per-tab snapshots and legacy flat entries (where `result === state`, carrying a top-level
    /// `color_modes`). A result-less entry leaves the modes empty.
    column_color_modes = result.color_modes || {};
    clear();
    /// Reset the result-action targets, so an empty/other tab can't download or copy the
    /// previously active tab's query/result. Shown again below if a result renders. They
    /// follow the PRODUCING query/params, not the (possibly edited) editor.
    document.getElementById('download-div').style.display = 'none';
    document.getElementById('copy-div').style.display = 'none';
    last_query_for_download = result.query || '';
    last_params_for_download = result.params || {};
    query_area.value = state.query;
    query_area.dispatchEvent(new Event('input'));
    /// Graph detection keys off the producing query, so a snapshot still renders as a graph
    /// even if the editor query was changed without rerunning.
    resultEl.queryText = result.query ?? state.query;

    /// Restore query parameter inputs and their values. Replace the FULL snapshot rather than
    /// overlaying `state.params`: when the previous and restored tabs share a placeholder name,
    /// `updateQueryParams` keeps the existing input (the detected param list is unchanged), so a
    /// value from the previous tab would leak into a param the restored tab leaves unset. Reset
    /// every detected param explicitly (absent -> ''), then capture the snapshot into the active
    /// tab so its stored params match what is shown and will run.
    /// `updateQueryParams` awaits tokenization, and `activateTab` has already made this tab active,
    /// but the `param_*` inputs still hold the previous tab's values until `setParamValues` below.
    /// Mark the restore as in flight so a `captureActiveTab` running during the await (the debounced
    /// `persist`, or a quick second navigation) does not snapshot those stale inputs into this tab.
    params_restore_pending_token = token;
    const params_ok = await updateQueryParams();
    if (token !== request_num) return;
    const restored_params = {};
    if (params_ok)
    {
        for (const param of currentQueryParams)
        {
            restored_params[param.name] = state.params?.[param.name] ?? '';
        }
        setParamValues(restored_params);
    }
    else
    {
        /// Tokenization did not rebuild the parameter list (e.g. a query too large for the WASM
        /// lexer, or no lexer at all), so `currentQueryParams` may still describe the PREVIOUS
        /// tab. Deriving params from it would inject that tab's placeholder names into this one
        /// and persist them into history / `IndexedDB`. Fall back to this tab's own saved
        /// snapshot, and clear the stale param inputs (and the stale list) so the previous tab's
        /// names/values cannot linger in the UI or leak through `getParamValues`.
        queryParamsContainer.innerHTML = '';
        currentQueryParams = [];
        Object.assign(restored_params, state.params || {});
    }
    const active_tab_for_params = getActiveTab();
    if (active_tab_for_params) active_tab_for_params.params = restored_params;
    /// Parameters are now committed to both the DOM inputs and the tab; capture is safe again.
    params_restore_pending_token = null;

    /// A snapshotted multi-query ("Run all") result is restored into the multi-query
    /// container, rebuilding one result element per statement, rather than into `resultEl`.
    if (result.multi && result.multi.length) {
        await restoreMultiQuery(result, token);
        return;
    }

    if (!result.data) return;

    let is_table = false;
    let is_raw = false;
    let is_chart = false;
    let is_error = false;

    let format = result.format;

    if (result.data.startsWith('event:')) {
        /// A framing `EventStream` snapshot: replay the multiplexed data, logs, progress, and
        /// (on failure) the exception. The default format is a table; any other text format is raw
        /// text; a `base64` format (binary or raw output) is decoded and rendered as an image or raw
        /// text (mirroring the live path in `postImpl`). Fall through to the shared finish on success.
        const base64 = !!result.base64;
        const raw_text = !base64 && !isDefaultFormat(format);
        resultEl.enableViews();
        const rendered_image = renderEventStreamText(result.data, resultEl, raw_text, base64, imageMimeForFormat(format));
        if (base64) { if (!rendered_image) is_raw = true; }
        else if (raw_text) is_raw = true; else is_table = true;
        if (!result.ok) {
            is_error = true;
            logoEl.style.display = 'none';
            progressEl.clear();
            return;
        }
    } else if (!result.ok) {
        is_error = true;
        /// Hide the idle logo for the whole error branch, matching the live single-query error
        /// path (`postSingle` hides it once at the top of its `!result.response_ok` block, for
        /// both JSON exceptions and plain-text errors). Restoring a JSON exception previously
        /// left the logo showing, so a reloaded/switched-back error tab looked different from the
        /// original run.
        logoEl.style.display = 'none';

        /// A failed query that carried its own `JSONEachPacket*` framing saved its raw packet stream
        /// as `data` (data, log, and progress packets ending with an `exception` packet), not a plain
        /// `{"exception": ...}` error body. Replay it as raw text - the way the live run showed it -
        /// instead of rendering the whole packet stream as one opaque error string, so the partial
        /// output and the exception packet stay visible. An NDJSON packet stream always begins with a
        /// `{"packet": ...}` object (mirroring the `event:`-prefix check above for `EventStream`).
        if (result.data.startsWith('{"packet":')) {
            is_raw = true;
            resultEl.updateRaw(result.data);
            progressEl.clear();
            return;
        }

        let has_exception = false;
        for (const line of result.data.split('\n')) {
            if (line.startsWith(`{"exception":`)) {
                resultEl.update(JSON.parse(line));
                has_exception = true;
                break;
            }
        }
        if (!has_exception) {
            resultEl.renderError(result.data);
        }

        progressEl.clear();
        return;
    } else if (format == default_format) {
        is_table = true;
        let lines = result.data.split('\n');
        let fragment = document.createDocumentFragment();

        for (const line of lines) {
            if (line.length == 0) continue;
            if (!resultEl.update(JSON.parse(line), fragment)) { break; }
        }

        resultEl.flushFragment(fragment);
    } else if (format == 'JSONCompactColumns') {
        is_chart = true;
        if (token !== request_num) { return; }
        /// renderChart awaits the uPlot loader on first use; the predicate makes it bail
        /// inside (right after the load, before mutating the DOM) if a tab switch superseded
        /// this activation, and we re-check here too.
        try {
            await resultEl.renderChart(JSON.parse(result.data), () => token === request_num);
        } catch (e) {
            /// The external chart library failed to load (e.g. CDN blocked). Show the error
            /// for this saved snapshot instead of throwing out of the activation half-rendered.
            if (token !== request_num) return;
            console.log(e);
            resultEl.renderError(e.toString());
            logoEl.style.display = 'none';
            progressEl.clear();
            return;
        }
        if (token !== request_num) { return; }
    } else {
        is_raw = true;
        resultEl.updateRaw(result.data);
    }

    if (resultEl.isExplainGraph) {
        try {
            await resultEl.renderGraph(() => token === request_num);
        } catch (e) {
            /// The Viz loader failed; show the error instead of throwing out of the activation.
            if (token !== request_num) return;
            console.log(e);
            resultEl.renderError(e.toString());
            logoEl.style.display = 'none';
            progressEl.clear();
            return;
        }
        if (token !== request_num) return;
    } else {
        /// Render totals before coloring, so the totals row is colored on first paint too.
        if (is_table) resultEl.renderTotals();
        resultEl.applyColumnColors();
        if (is_table) resultEl.transposeIfNeeded();
        if (is_table) resultEl._changeTableLayout();
    }

    progressEl.finish();
    /// A result is shown for this tab, so its download/copy actions apply to this query.
    document.getElementById('download-div').style.display = 'block';
    document.getElementById('copy-div').style.display = is_raw ? 'block' : 'none';

    if (is_raw) {
        resultEl.elapsedNs = result.elapsed_ns;
    }
    elapsed_ns = resultEl.elapsedNs;

    progressEl.updateText(resultEl.rowCount, resultEl.elapsedNs, resultEl.incompleteResult);
    progressEl.style.setProperty('--progress', '0%');
    document.documentElement.style.setProperty('--background-color-rotate', queryToColor(state.query));
}

let query_area = document.getElementById('query');

/// Opening a table in a new tab via a middle click focuses the query editor. On Linux/X11 the
/// middle button additionally pastes the PRIMARY selection into the freshly-focused editor,
/// appending clipboard junk after the query we just set. The new-tab activation (`activateTab`
/// with `guard_paste`) arms this flag right around that `query_area.focus()`, so we swallow
/// exactly that one paste.
///
/// The guard must never eat a real keyboard paste. The X11 PRIMARY paste is mouse-driven and
/// carries no keystroke, whereas a real keyboard paste - Ctrl+V / Cmd+V, or Shift+Insert on
/// Linux/Windows - is always preceded by its own paste-shortcut `keydown`; disarming on that
/// `keydown` (which fires before the resulting `paste`) keeps the discrimination independent of
/// timing. So even if the user middle-clicks and immediately presses a paste shortcut on a platform
/// where no PRIMARY paste ever arrives, their paste is preserved; the short post-focus fallback in
/// `activateTab` only bounds how long a never-consumed guard can linger.
///
/// The guard is a single shared bit, so we keep the handle of its one fallback timer and cancel
/// it whenever the guard is re-armed or consumed. Otherwise two overlapping middle-click opens
/// (open A, then open B within the fallback window) would share the bit but leave two pending
/// timeouts: A's stale timeout could clear the bit that B re-armed, before B's PRIMARY paste
/// arrives, letting that paste land in the editor. Cancelling the previous timer on re-arm means
/// an older open's timeout can never clear a newer open's guard.
let suppress_middleclick_paste = false;
let middleclick_paste_timeout = null;
function disarmMiddleclickPaste() {
    suppress_middleclick_paste = false;
    clearTimeout(middleclick_paste_timeout);
    middleclick_paste_timeout = null;
}
query_area.addEventListener('keydown', e => {
    const keyboard_paste = ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V'))
        || (e.shiftKey && e.key === 'Insert');
    if (keyboard_paste) disarmMiddleclickPaste();
});
query_area.addEventListener('paste', e => {
    if (suppress_middleclick_paste) {
        e.preventDefault();
        disarmMiddleclickPaste();
    }
});

appendTextareaResizer();

/// ===== Tabs =====================================================================
/// A tab bundles a query, its title, query parameters and a result snapshot.
/// We keep one editor + one result element and swap content on activation.

const tab_bar_elem = document.getElementById('tab-bar');
const tabs_elem = document.getElementById('tabs');

/// The connection parameters (url/user/password) live in the `#inputs` element. When the tab
/// bar is shown they clutter the top of every tab, so we relocate that same element into a
/// drop-down behind a 🔑 button in the top-right corner. Relocating the existing element (rather
/// than duplicating the inputs) keeps every reference and event listener bound to it valid. The
/// three inputs carry `form="controls"`, so once moved out of the form's subtree they still count
/// as its fields: pressing `Enter` in url/user/password keeps submitting `#controls` (running the
/// query), matching the inline single-tab layout.
const inputs_elem = document.getElementById('inputs');
const controls_elem = document.getElementById('controls');
const connection_menu_elem = document.getElementById('connection-menu');
const connection_key_elem = document.getElementById('connection-key');
const connection_dropdown_elem = document.getElementById('connection-dropdown');

function openConnectionDropdown() {
    connection_dropdown_elem.hidden = false;
    connection_key_elem.setAttribute('aria-expanded', 'true');
    /// The url input was unmeasurable while the drop-down was display:none; recompute now.
    updateServerInfoVisibility();
}

function closeConnectionDropdown() {
    connection_dropdown_elem.hidden = true;
    connection_key_elem.setAttribute('aria-expanded', 'false');
}

/// Place the `#inputs` element either inline in `#controls` (no tab bar) or inside the
/// drop-down behind the 🔑 button (tab bar shown). Called from `renderTabBar` whenever the
/// tab bar's visibility is recomputed.
function syncConnectionUI() {
    const tabsShown = !tab_bar_elem.hidden;
    /// Capture whether the 🔑 button owns focus before the next line may hide it: hiding a focused
    /// element strands keyboard focus, so on the drop-down→inline transition we hand focus to a
    /// visible control below (the mirror of the inline→drop-down handoff).
    const keyHadFocus = document.activeElement === connection_key_elem;
    connection_key_elem.hidden = !tabsShown;
    if (tabsShown) {
        if (inputs_elem.parentElement !== connection_dropdown_elem) {
            /// If focus is inside `#inputs` when the tab bar first appears (e.g. the user pressed
            /// Enter in url/user/password to run the first query — reachable because those fields
            /// keep `form="controls"` and submit implicitly), moving the subtree into the hidden
            /// drop-down would strand focus on a hidden element. Move focus to the now-visible 🔑
            /// button first — as the Escape handler does — so keyboard users keep a visible focus
            /// target and the inputs stay one key press away behind that button.
            const refocus = inputs_elem.contains(document.activeElement);
            connection_dropdown_elem.appendChild(inputs_elem);
            if (refocus) connection_key_elem.focus();
        }
    } else {
        /// Restore the inline position (first child of the form) and make sure the drop-down
        /// is closed so a later reappearance of the tab bar starts collapsed.
        if (inputs_elem.parentElement !== controls_elem) {
            controls_elem.insertBefore(inputs_elem, controls_elem.firstChild);
        }
        closeConnectionDropdown();
        /// The `#connection-key` button was just hidden; if it owned focus, hand focus to the
        /// now-visible inline `url` input — the first connection field the button gated — so
        /// keyboard focus stays visible and the next Tab continues from the connection row.
        if (keyHadFocus) url_elem.focus();
    }
    /// The url input's width differs between the inline bar and the drop-down, so the point at
    /// which the hostname reaches the version/uptime indicator changes: recompute its visibility.
    updateServerInfoVisibility();
}

connection_key_elem.addEventListener('click', (e) => {
    /// Keep the toggle click from reaching the result-selection handler on `document`.
    e.stopPropagation();
    if (connection_dropdown_elem.hidden) openConnectionDropdown(); else closeConnectionDropdown();
});

/// A click inside the drop-down (e.g. typing in the inputs) must neither close it nor clear the
/// result selection, so keep it from bubbling to `document`.
connection_dropdown_elem.addEventListener('click', (e) => e.stopPropagation());

/// Close the drop-down on a click anywhere outside `#connection-menu` (which holds the 🔑 button
/// and the drop-down). Test the target in the capture phase instead of relying on the click
/// bubbling to `document`: several outside controls in this file (the download menu, the
/// databases-panel toggles, the terminal toggle, the tab-close button, the per-column toggles)
/// call `stopPropagation()` in their own bubble-phase click handlers, so a bubbling listener
/// would never see those clicks and the popover would stay open. A capture-phase listener runs
/// before all of them, so every outside interaction dismisses it.
///
/// A `click` fires on the nearest common ancestor of the `mousedown` and `mouseup` targets, so a
/// text selection that starts inside an input (e.g. selecting the user name) and is dragged past
/// the drop-down's border before release lands its `click` on an ancestor outside `#connection-menu`
/// — which would wrongly dismiss the popover mid-selection. Remember where the pointer went down
/// (capture phase, so it is unaffected by `stopPropagation()` on inner handlers) and only close
/// when the interaction both started and ended outside the menu.
let connection_pointerdown_inside = false;
document.addEventListener('mousedown', (e) => {
    connection_pointerdown_inside = connection_menu_elem.contains(e.target);
}, true);
document.addEventListener('click', (e) => {
    /// The latch is meaningful only for the pointer press that produced this `click`, and a press
    /// arms it only when it goes on to emit a `click` (`detail !== 0`). Two kinds of `click` must
    /// therefore ignore it: a keyboard or synthetic activation (Space/Enter on a focused control, or
    /// a programmatic `.click()`) reports `detail === 0` and has no preceding `mousedown`; and a
    /// mouse interaction that ends without a `click` — a right-click's `contextmenu`, a middle-click,
    /// or a drag released outside the window — leaves a stale latch that no `click` ever consumes.
    /// In both cases a stale `true` would otherwise wrongly suppress the outside dismissal, so the
    /// latch counts only for a real pointer `click`.
    const started_inside = e.detail !== 0 && connection_pointerdown_inside;
    if (!connection_menu_elem.contains(e.target) && !started_inside) closeConnectionDropdown();
}, true);
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !connection_dropdown_elem.hidden) {
        /// Closing hides the subtree that may own focus (a connection input). Return focus to
        /// the 🔑 button — as the download menu does with its trigger — so keyboard users keep a
        /// visible focus target and the next Tab continues from the tab bar, not the page top.
        const refocus = connection_dropdown_elem.contains(document.activeElement);
        closeConnectionDropdown();
        if (refocus) connection_key_elem.focus();
    }
});

/// The connection inputs keep `form="controls"`, so native constraint validation (e.g. the
/// `type="url"` check on `#url`) still runs on submit while they sit in the closed drop-down.
/// A hidden invalid control blocks the submit with no visible bubble, leaving the Run button
/// dead. Open the drop-down when a connection field reports invalid, so the browser shows its
/// validation bubble on a now-visible control. `invalid` does not bubble, so listen in the
/// capture phase. In the single-tab layout the 🔑 button is hidden and the inputs are already
/// visible inline, so nothing is opened.
inputs_elem.addEventListener('invalid', () => {
    if (!connection_key_elem.hidden && connection_dropdown_elem.hidden) openConnectionDropdown();
}, true);

/// Generate the next default title: "Query A" .. "Query Z", "Query AA", ...
/// Skips titles already in use so closing/reopening doesn't produce duplicates.
function nextDefaultTitle() {
    const used = new Set(tabs.map(t => t.title));
    for (;;) {
        let n = tabTitleSeq++;
        let letters = '';
        do { letters = String.fromCharCode(65 + (n % 26)) + letters; n = Math.floor(n / 26) - 1; } while (n >= 0);
        const title = 'Query ' + letters;
        if (!used.has(title)) return title;
    }
}

/// Tab titles double as the URL `tab=` key and the startup-reconciliation lookup key, so
/// they must stay unique: two tabs sharing a title would let a shared/reloaded URL match —
/// and overwrite — the wrong tab. If `desired` collides with another tab (ignoring the tab
/// `excludeId`, i.e. the one being renamed), disambiguate by appending " (2)", " (3)", …
function uniqueTitle(desired, excludeId) {
    const taken = new Set(tabs.filter(t => t.id !== excludeId).map(t => t.title));
    if (!taken.has(desired)) return desired;
    for (let i = 2; ; ++i) {
        const candidate = desired + ' (' + i + ')';
        if (!taken.has(candidate)) return candidate;
    }
}

function makeTab(title, query) {
    return {
        id: 't' + (++tabSeq),
        title: title || nextDefaultTitle(),
        query: query || '',
        params: {},
        result: null,          /// last result snapshot (history-state shape) or null
        lastSavedQuery: undefined,
    };
}

function getActiveTab() {
    return tabs.find(t => t.id === activeTabId) || null;
}

/// Serialize the live editor (query text + parameter values) into the active tab.
/// The result snapshot is written separately by `saveHistory` after a run.
function captureActiveTab() {
    const tab = getActiveTab();
    if (!tab) return;
    tab.query = query_area.value;
    /// While an activation is restoring this tab's parameter inputs (after the `updateQueryParams`
    /// await in `restoreFromHistory`, before `setParamValues`), the `param_*` DOM inputs still hold
    /// the previously active tab's values. Snapshotting them now would overwrite this tab's own
    /// parameters with the previous tab's and later reload/run with the wrong values. Skip the
    /// parameter capture until the restore commits. `tab.query` is safe: `restoreFromHistory` sets
    /// the editor to this tab's query before the await. The guard lifts automatically once a run or
    /// a newer activation advances `request_num`, so it can never suppress capture indefinitely.
    if (params_restore_pending_token !== request_num) tab.params = getParamValues();
}

/// Invalidate any in-flight query and abort its HTTP requests, so a late response cannot
/// render or be saved into the now-active tab. Bumping `request_num` also supersedes any
/// run still suspended on an await (it captured the old value) and any in-progress tab
/// activation (`restoreFromHistory` bails when the token no longer matches `request_num`).
function invalidateInFlight() {
    ++request_num;
    if (controller) controller.abort();
    for (const ac of multiQueryControllers) ac.abort();
    multiQueryControllers = [];
    if (typeof in_flight !== 'undefined' && in_flight) endFlight();
}

/// Load a tab's content into the editor and re-render its stored result.
/// Routed through `restoreFromHistory` so the syntax backdrop, params and run
/// buttons resync (it dispatches an 'input' event), exactly like history navigation.
async function activateTab(id, guard_paste = false) {
    const tab = tabs.find(t => t.id === id);
    if (!tab) return;
    activeTabId = id;
    invalidateInFlight();
    const token = request_num;

    /// Restore the editor from the live tab.query/tab.params (latest edits), while rendering
    /// the stored result from tab.result, which keeps its own producing query/params.
    await restoreFromHistory({ query: tab.query, params: tab.params, result: tab.result }, token);
    if (token !== request_num) return; /// a newer activation/run superseded this one
    /// Always recolor the page (and thus the active tab slab) to this tab's query,
    /// even when there is no result to render (restoreFromHistory skips this otherwise).
    document.documentElement.style.setProperty('--background-color-rotate', queryToColor(tab.query));
    renderTabBar();
    /// A middle-click new-tab open arms the X11 PRIMARY paste guard right around this focus, so
    /// the paste Linux delivers to the freshly-focused editor is swallowed - and only that one.
    /// Anchoring the guard here, rather than at the original `auxclick`, means a slow activation
    /// can never let it expire before focus. It is cleared by the swallowed paste, by a real
    /// paste-shortcut keydown (which must never be eaten - see `suppress_middleclick_paste`), or by
    /// the short fallback below in case no paste fires at all (non-Linux, empty selection), so the
    /// flag can never linger. Re-arming here cancels any previous open's pending fallback timer, so
    /// an overlapping middle-click open cannot have its guard cleared by an earlier open's timeout.
    if (guard_paste) {
        clearTimeout(middleclick_paste_timeout);
        suppress_middleclick_paste = true;
    }
    query_area.focus();
    if (guard_paste) middleclick_paste_timeout = setTimeout(disarmMiddleclickPaste, 250);
}

/// Switch tabs in response to a user click: capture the current tab, activate the
/// target, and push a browser-history entry so Back/Forward moves between tabs.
async function switchToTab(id) {
    if (id === activeTabId) return;
    captureActiveTab();
    /// Fold the captured editor state of the tab we are leaving back into its own history
    /// entry, so a later Back/Forward to it restores the latest edit rather than the stale
    /// last-run/URL snapshot.
    refreshCurrentHistoryEntry(getActiveTab());
    await activateTab(id);
    syncHistory();
}

function addTab() {
    markBootstrapDirty();   /// user created a tab; reconciliation must preserve it
    captureActiveTab();
    refreshCurrentHistoryEntry(getActiveTab());
    const tab = makeTab();
    tabs.push(tab);
    activeTabId = tab.id;
    /// A brand new tab has no result; clear the editor and result area.
    activateTab(tab.id).then(syncHistory);
    scheduleSave();
}

/// Like `addTab`, but the new tab starts pre-filled with `query` and becomes active.
/// Used by the databases panel when a table is opened with a new-tab gesture: middle
/// click, Shift+click, or the platform's new-tab modifier click - Cmd+click on macOS,
/// Ctrl+click elsewhere (on macOS `Ctrl+Click` is the context-menu click, not a new-tab
/// gesture; see the manual matrix above `onTableActivate`). `guard_paste` is set for a
/// genuine middle click, so the activation swallows the X11 PRIMARY paste that follows
/// focusing the editor.
function openQueryInNewTab(query, guard_paste = false) {
    markBootstrapDirty();   /// user created a tab; reconciliation must preserve it
    captureActiveTab();
    refreshCurrentHistoryEntry(getActiveTab());
    const tab = makeTab(undefined, query);
    tabs.push(tab);
    activeTabId = tab.id;
    activateTab(tab.id, guard_paste).then(syncHistory);
    scheduleSave();
}

function closeTab(id) {
    const idx = tabs.findIndex(t => t.id === id);
    if (idx === -1) return;
    const wasActive = id === activeTabId;
    tabs.splice(idx, 1);
    if (tabs.length === 0) {
        /// Never leave zero tabs: start a fresh default one.
        const tab = makeTab();
        tabs.push(tab);
        activeTabId = tab.id;
        activateTab(tab.id).then(syncHistory);
    } else if (wasActive) {
        /// Prefer the right neighbour, otherwise the left.
        const next = tabs[Math.min(idx, tabs.length - 1)];
        activeTabId = next.id;
        activateTab(next.id).then(syncHistory);
    } else {
        renderTabBar();
    }
    scheduleSave();
}

/// Begin inline editing of the active tab's title. The title `span` itself becomes
/// editable (rather than swapping in an `input`), so it grows with its content and the
/// tab width does not jump when editing starts.
function startTitleEdit(tab, titleEl) {
    titleEl.contentEditable = 'true';
    titleEl.spellcheck = false;
    titleEl.classList.add('editing');
    /// Drop the hover tooltip while typing so it does not linger with the old title.
    titleEl.removeAttribute('title');
    /// Mark the tab so it drops its max-width and flexes to fit the title being typed.
    titleEl.closest('.tab').classList.add('editing');

    /// Select the whole title for easy replacement.
    const range = document.createRange();
    range.selectNodeContents(titleEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    titleEl.focus();

    let done = false;
    const commit = (save) => {
        if (done) return;
        done = true;
        if (save) {
            /// Collapse any pasted newlines/runs of whitespace into single spaces.
            const v = titleEl.textContent.replace(/\s+/g, ' ').trim();
            /// Keep titles unique (they key the URL `tab=` reconciliation), disambiguating
            /// a collision rather than letting two tabs share a name.
            if (v) tab.title = uniqueTitle(v, tab.id);
        }
        renderTabBar();   /// rebuilds the bar, replacing this editable span with a static one
        syncHistory();
        scheduleSave();
    };
    titleEl.addEventListener('keydown', (e) => {
        /// Keep keys (Space/Enter) from reaching the tab-level switch handler.
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); commit(true); }
        else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
    });
    titleEl.addEventListener('blur', () => commit(true));
}

/// Rebuild the whole tab bar. Cheap (few nodes) so we never diff.
function renderTabBar() {
    const active = getActiveTab();
    /// Hidden when there is a single tab that has never produced a result from a genuine
    /// run, so the page looks exactly as before tabs existed. Keying off `result.ran`
    /// (rather than merely `result != null`) also ignores any stale/fabricated result
    /// snapshot that an older build may have persisted to IndexedDB.
    tab_bar_elem.hidden = (tabs.length <= 1 && !(active && active.result && active.result.ran));
    syncConnectionUI();

    tabs_elem.textContent = '';
    for (const tab of tabs) {
        const el = document.createElement('div');
        el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
        el.dataset.id = tab.id;
        el.tabIndex = 0;
        /// Inactive tabs are tinted by the hash of their own query text.
        el.style.setProperty('--tab-hue', queryToColor(tab.query));

        const titleEl = document.createElement('span');
        titleEl.className = 'tab-title';
        titleEl.textContent = tab.title;
        /// Native tooltip so a title truncated by the width cap can still be read in full on hover.
        titleEl.title = tab.title;
        el.appendChild(titleEl);

        const closeEl = document.createElement('span');
        closeEl.className = 'tab-close';
        closeEl.title = 'Close';
        closeEl.textContent = '×';
        el.appendChild(closeEl);

        el.addEventListener('click', (e) => {
            if (e.target === closeEl) { e.stopPropagation(); closeTab(tab.id); return; }
            if (tab.id === activeTabId) {
                if (e.target === titleEl) startTitleEdit(tab, titleEl);
            } else {
                switchToTab(tab.id);
            }
        });
        el.addEventListener('keydown', (e) => {
            /// Ignore keys coming from the inline title editor (so Space/Enter type normally).
            if (e.target !== el) return;
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); switchToTab(tab.id); }
        });
        tabs_elem.appendChild(el);
    }
}

document.getElementById('tab-add').addEventListener('click', addTab);

/// Mouse wheel over the tab panel switches tabs: scrolling up or left -> previous (left)
/// tab, down or right -> next (right) tab. The dominant axis is used, so both vertical and
/// horizontal wheels/trackpad gestures work. Deltas are accumulated (and normalized for
/// line-mode) so one mouse notch switches one tab and a trackpad swipe switches once per
/// threshold; switching stops at the ends.
let wheel_accum = 0;
tab_bar_elem.addEventListener('wheel', (e) => {
    if (tabs.length < 2) return; /// nothing to switch; let the page scroll
    e.preventDefault();
    const scale = e.deltaMode === 1 ? 16 : 1;
    const dx = e.deltaX * scale, dy = e.deltaY * scale;
    wheel_accum += Math.abs(dx) > Math.abs(dy) ? dx : dy;
    if (Math.abs(wheel_accum) < 40) return;
    const dir = wheel_accum > 0 ? 1 : -1; /// down/right (+) -> right, up/left (-) -> left
    wheel_accum = 0;
    const idx = tabs.findIndex(t => t.id === activeTabId);
    const next = idx + dir;
    if (next >= 0 && next < tabs.length) switchToTab(tabs[next].id);
}, { passive: false });

/// ----- IndexedDB persistence ----------------------------------------------------
/// Stores the workspace (tabs, titles, active tab, order and small result snapshots)
/// so it survives reloads. Best-effort: any failure degrades to in-memory-only tabs.

const DB_NAME = 'clickhouse-play';
const TAB_STORE = 'tabs';
const META_STORE = 'meta';

function openDb() {
    return new Promise((resolve) => {
        let req;
        try {
            req = indexedDB.open(DB_NAME, 1);
        } catch (e) {
            resolve(null);
            return;
        }
        req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(TAB_STORE)) db.createObjectStore(TAB_STORE, { keyPath: 'id' });
            if (!db.objectStoreNames.contains(META_STORE)) db.createObjectStore(META_STORE, { keyPath: 'key' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
    });
}

async function loadFromDb() {
    const db = await dbReady;
    if (!db) return null;
    return new Promise((resolve) => {
        try {
            const tx = db.transaction([TAB_STORE, META_STORE], 'readonly');
            const tabsReq = tx.objectStore(TAB_STORE).getAll();
            const metaReq = tx.objectStore(META_STORE).get('state');
            tx.oncomplete = () => resolve({ records: tabsReq.result || [], meta: metaReq.result || null });
            tx.onerror = () => resolve(null);
        } catch (e) {
            resolve(null);
        }
    });
}

let save_timer = null;
function scheduleSave() {
    if (save_timer) return;
    save_timer = setTimeout(() => { save_timer = null; persist(); }, 400);
}

async function persist() {
    const db = await dbReady;
    if (!db) return;
    captureActiveTab();
    try {
        const tx = db.transaction([TAB_STORE, META_STORE], 'readwrite');
        const tabStore = tx.objectStore(TAB_STORE);
        tabStore.clear();
        for (const tab of tabs) {
            tabStore.put({
                id: tab.id,
                title: tab.title,
                query: tab.query,
                params: tab.params,
                result: tab.result,
                /// The query as of the last URL/history sync. Persisting it lets startup
                /// reconciliation tell a stale reload (the URL hash is this tab's own last
                /// synced query, but the tab was edited afterwards) from a fresh external URL.
                lastSavedQuery: tab.lastSavedQuery,
            });
        }
        tx.objectStore(META_STORE).put({
            key: 'state',
            activeTabId: activeTabId,
            tabOrder: tabs.map(t => t.id),
            tabSeq: tabSeq,
            tabTitleSeq: tabTitleSeq,
        });
    } catch (e) {
        /// Ignore persistence failures (private mode, quota, etc.).
    }
}

/// ----- Browser history + URL ----------------------------------------------------

/// Build the query-string parameters (user/run/url/param_*/tab) shared by history
/// entries. Connection settings are global; the active tab name is appended so a
/// shared URL can be reconciled against saved tabs on load.
/// `fromRun` marks an entry that a genuine run produced (see `writeHistoryEntry`).
function buildHistoryParams(params, tabName, fromRun, colorModes) {
    const out = [];
    const user = user_elem.value;
    const server_address = url_elem.value;
    if (user) out.push('user=' + encodeURIComponent(user));
    /// Only carry `run=1` for an entry whose query/params were produced by a genuine run and
    /// still match it (`fromRun`). `saveHistory` sets it on the run itself; the editor-only
    /// writers (`syncHistory`/`refreshCurrentHistoryEntry`, driven by tab switch/rename,
    /// parameter edits and startup sync) recompute it from `tabReflectsRun`, preserving the
    /// marker while the editor is unchanged (so a shared `run=1` link whose result is not
    /// snapshotted — an image or oversized result — stays reproducible across a tab switch or
    /// rename), but dropping it the moment the editor diverges from the produced result. An
    /// unrun edit must never keep `run=1`: reloading would auto-execute it (e.g. a
    /// `DROP`/`INSERT`), because startup treats a `run=1` URL as authoritative.
    if (run_immediately && fromRun) out.push('run=1');
    if (server_address != location.origin) out.push('url=' + encodeURIComponent(server_address));
    for (const [name, value] of Object.entries(params || {})) {
        /// Serialize every parameter, including empty strings: an empty value is valid for a
        /// String parameter and must be distinguishable from "absent" on load (read back with
        /// URLSearchParams.get, which returns '' for present-empty and null for absent).
        if (value === undefined || value === null) continue;
        out.push('param_' + encodeURIComponent(name) + '=' + encodeURIComponent(value));
    }
    /// Carry the result's per-column color coding modes so a shared/reloaded URL restores them.
    if (colorModes && Object.keys(colorModes).length > 0) {
        out.push('color_modes=' + encodeURIComponent(JSON.stringify(colorModes)));
    }
    if (tabName) out.push('tab=' + encodeURIComponent(tabName));
    return out;
}

/// Write a browser-history entry + URL derived from the tab. The top-level query/params
/// are the EDITOR state (also the URL hash and the de-dup key); `result` is the snapshot
/// that produced the rendered result, carrying its OWN query/params so rendering/download
/// stay tied to the producing query even if the editor was edited without rerunning.
/// `titleForDoc` overrides the document title text. When `forceReplace` is set, the current
/// entry is replaced in place even if the query changed (used to refresh the entry of a tab
/// being left so it carries the latest editor edit rather than the last run/URL snapshot).
/// `fromRun` is set only by `saveHistory` (an actual run) so the URL carries `run=1`; every
/// editor-only caller leaves it unset so an unrun edit is never re-stamped as auto-runnable.
function writeHistoryEntry(tab, titleForDoc, forceReplace, fromRun) {
    /// Skip a fresh entry if neither the active tab nor its query changed.
    const cur = history.state;
    const sameTab = cur && cur.tabId === tab.id;
    const unchanged = sameTab && cur.query === tab.query;

    const state = {
        query: tab.query,
        params: tab.params,
        result: tab.result || null,
        tabId: tab.id,
        tabName: tab.title,
    };
    const title = "ClickHouse Query: " + (titleForDoc || tab.query);
    const history_params = buildHistoryParams(tab.params, tab.title, fromRun, tab.result && tab.result.color_modes);
    let history_url = window.location.pathname;
    if (history_params.length > 0) history_url += '?' + history_params.join('&');
    history_url += '#' + toBase64(tab.query);

    if (!cur || unchanged || (forceReplace && sameTab)) {
        history.replaceState(state, title, history_url);
    } else {
        history.pushState(state, title, history_url);
    }
    document.title = title;
    tab.lastSavedQuery = tab.query;
    renderTabBar();
    scheduleSave();
}

/// True when the tab's editor (query + params) still exactly matches the query/params that
/// produced its current result, i.e. re-running the editor would reproduce what is shown. The
/// editor-only history writers use it to decide whether to keep `run=1` on the entry: a shared
/// `run=1` link whose result is not snapshotted (an image or an oversized result) must stay
/// re-runnable across a tab switch or rename, but the marker must be dropped the moment the
/// editor diverges from the produced result so an unrun edit is never auto-executed on reload.
/// `result.query` is the FULL editor text for a single "Run" and for a multi-query "Run all"
/// (both store the editor into `tab.query` and into the snapshot), so the two are equal while
/// the tab is clean; a "Run selected" result stores only the selected statement, so it compares
/// unequal to the full editor and conservatively drops the marker (its URL hash is the whole
/// editor and could not reproduce that single-statement result anyway).
function tabReflectsRun(tab) {
    return !!(tab && tab.result && tab.result.ran
        && tab.query === tab.result.query
        && JSON.stringify(tab.params || {}) === JSON.stringify(tab.result.params || {}));
}

/// Refresh the current browser-history entry in place from the given tab's captured editor
/// state. Called when leaving a tab, and on every trusted editor edit, so a later Back/Forward
/// to its entry (or a reload) restores the latest edit instead of the last run/URL snapshot.
/// Without this, an edit made after the last run lives only in memory, and the next `popstate`
/// would restore the stale entry (still holding the old query) and overwrite it. The `run=1`
/// marker is preserved while the editor still reflects the produced run (`tabReflectsRun`) and
/// dropped once it diverges, so an unrun edit never becomes auto-runnable while a clean tab
/// stays reproducible from a shared `run=1` link.
///
/// When an entry already exists it must belong to this tab — refreshing another tab's entry
/// would clobber it, so bail in that case. When there is NO state yet we still seed one: a
/// fresh load leaves `history.state` null until the first `syncHistory`/`postAll`, and the very
/// first trusted edit can land before `reconcileStartup` runs any of those (the no-saved-tabs
/// bare-URL path and the dirty-startup merge never call them). That initial entry is the page's
/// own and conceptually belongs to the active tab, so replace it in place (`writeHistoryEntry`
/// uses `replaceState` when there is no state, never pushing a spurious entry). Seeding records
/// the edit in `history.state`, the URL hash and `lastSavedQuery`; otherwise the stale URL hash
/// stays authoritative and the next reload either reopens a stale tab (bare URL) or overwrites
/// the persisted live tab (dirty-startup merge) with the pre-edit query.
function refreshCurrentHistoryEntry(tab) {
    if (!tab) return;
    const cur = history.state;
    if (cur && cur.tabId !== tab.id) return;
    writeHistoryEntry(tab, undefined, /*forceReplace=*/ true, /*fromRun=*/ tabReflectsRun(tab));
}

/// Called after an actual run: stash the result snapshot on the active tab (this is
/// what makes the tab "have a result", hence visible in the bar) and record history.
/// The snapshot records the query/params that produced it.
function saveHistory(stateData, titleForDoc) {
    const tab = getActiveTab();
    if (!tab) return;
    tab.query = stateData.query;
    tab.result = {
        ran: true,   /// marks a genuine run; the tab bar's visibility keys off this
        /// The single statement that produced this result (in multi-query mode it differs
        /// from the editor text in tab.query); used for rendering/graph-detection/downloads.
        query: stateData.resultQuery ?? stateData.query,
        params: stateData.params,    /// the params that produced this result
        format: stateData.format,
        ok: stateData.ok,
        data: stateData.data,
        /// Whether the `EventStream` `data` snapshot carries base64-encoded payloads (a binary or raw
        /// output format); the replay path decodes them to bytes instead of showing the base64 text.
        base64: stateData.base64 ?? false,
        /// Per-statement snapshots for a multi-query ("Run all") result; null for single-query
        /// runs and for multi-query runs too large to snapshot (see `postMulti`).
        multi: stateData.multi ?? null,
        /// Per-column color coding modes in effect when this result was produced. Travels with the
        /// snapshot so re-activating the tab (or navigating to its entry / reloading) restores and
        /// re-applies the same coloring; a later toggle updates it via `persistColorModes`.
        color_modes: column_color_modes,
        elapsed_ns: stateData.elapsed_ns,
    };
    /// This entry was produced by an actual run, so it may carry `run=1` (a reload/shared link
    /// re-runs it). Editor-only writers (`syncHistory`/`refreshCurrentHistoryEntry`) never do.
    writeHistoryEntry(tab, titleForDoc, /*forceReplace=*/ false, /*fromRun=*/ true);
}

/// Record a history entry for the active tab on tab switch / rename. Reuses the tab's
/// existing result (or none); does NOT fabricate a result, so a never-run single tab
/// stays result-less and the tab bar stays hidden. Keeps the entry's `run=1` marker while the
/// editor still reflects the produced run (`tabReflectsRun`) so switching INTO a run-backed tab
/// leaves its shared `run=1` URL as re-runnable as `saveHistory` left it; a result-less or
/// edited tab reports false and the marker is dropped.
function syncHistory() {
    const tab = getActiveTab();
    if (!tab) return;
    writeHistoryEntry(tab, undefined, /*forceReplace=*/ false, /*fromRun=*/ tabReflectsRun(tab));
}

/// Resolve which tab a history state refers to. The `tabId` is the AUTHORITATIVE, stable
/// identity: when the state carries one it wins, and we never fall back to matching by title.
/// A same-titled tab may be an unrelated one the user has since renamed to the closed tab's
/// old title, and adopting it would let Back/Forward overwrite that live tab's query/result.
/// The title fallback exists ONLY for legacy entries predating `tabId`. When a state's
/// `tabId` names a tab that was closed, recreate a fresh tab (disambiguating its title) so
/// the navigation is non-destructive instead of hijacking an existing tab.
function resolveTabForState(state) {
    let tab = state.tabId && tabs.find(t => t.id === state.tabId);
    if (!tab && !state.tabId && state.tabName) tab = tabs.find(t => t.title === state.tabName);
    if (!tab) {
        const title = state.tabId ? uniqueTitle(state.tabName) : state.tabName;
        tab = makeTab(title, state.query);
        tabs.push(tab);
    }

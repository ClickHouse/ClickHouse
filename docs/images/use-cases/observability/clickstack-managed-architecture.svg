<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" fill="none">
  <title>ClickHouse Observability managed architecture</title>
  <desc>OTLP over gRPC and HTTP enters the managed OpenTelemetry collector, which writes to ClickHouse. ClickStack UI queries ClickHouse. All three components are managed by ClickHouse Cloud.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" stroke="#A3A3A0" stroke-width="2" fill="none"/></marker>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <g fill="#A3A3A0" font-family="Inconsolata, monospace" font-size="22">
      <text x="350" y="42">OTLP (gRPC)</text><text x="590" y="42">OTLP (HTTP)</text>
    </g>
    <rect x="100" y="105" width="740" height="560" rx="16" stroke="#A3A3A0" stroke-width="1.5" stroke-dasharray="8 8"/>
    <text x="470" y="620" fill="#A3A3A0" font-size="21">ClickHouse Observability</text>
    <text x="470" y="647" fill="#A3A3A0" font-size="18">Managed by ClickHouse Cloud</text>
    <path d="M350 60v113" stroke="#A3A3A0" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M590 60v113" stroke="#A3A3A0" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="240" y="180" width="460" height="100" rx="12" fill="#A3A3A0" opacity=".18" filter="url(#glow)"/>
    <rect x="240" y="180" width="460" height="100" rx="8" fill="#3A3A36" stroke="#A3A3A0"/>

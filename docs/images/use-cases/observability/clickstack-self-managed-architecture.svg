<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" fill="none">
  <title>Self-managed ClickHouse Observability architecture</title>
  <desc>Applications send OTLP telemetry to an OpenTelemetry collector operated by the user. The collector writes to ClickHouse in ClickHouse Cloud, where ClickStack UI is also hosted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" stroke="#A3A3A0" stroke-width="2" fill="none"/></marker>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect x="170" y="285" width="600" height="390" rx="16" stroke="#A3A3A0" stroke-dasharray="7 7"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <g fill="#A3A3A0" font-family="Inconsolata, monospace" font-size="22">
      <text x="350" y="42">OTLP (gRPC)</text><text x="590" y="42">OTLP (HTTP)</text>
    </g>
    <path d="M350 60v58" stroke="#A3A3A0" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M590 60v58" stroke="#A3A3A0" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="240" y="125" width="460" height="110" rx="12" fill="#A3A3A0" opacity=".18" filter="url(#glow)"/>
    <rect x="240" y="125" width="460" height="110" rx="8" fill="#414141" stroke="#A3A3A0"/>
    <!-- Complete OpenTelemetry logo from cncf/artwork. -->
    <image x="320" y="140" width="300" height="80" href="data:image/svg+xml;base64,"/>
    <path d="M470 235v73" stroke="#A3A3A0" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="240" y="315" width="460" height="110" rx="12" fill="#FAFF69" opacity=".35" filter="url(#glow)"/>
    <rect x="240" y="315" width="460" height="110" rx="8" fill="#FAFF69" stroke="#A3A3A0"/>
<!-- Complete logo asset: docs/img/ch_logo_docs.svg. -->
<image x="305" y="321" width="330" height="98" href="data:image/svg+xml;base64,"/>
    <path d="M470 432v51" stroke="#A3A3A0" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="240" y="490" width="460" height="110" rx="12" fill="#A3A3A0" opacity=".18" filter="url(#glow)"/>
    <rect x="240" y="490" width="460" height="110" rx="8" fill="#414141" stroke="#A3A3A0"/>
    <!-- Exact yellow variant of the supplied ClickStack mark. -->
    <g transform="translate(312 520) scale(.18) translate(-57.4 -40)">
      <path d="M282.566 105V235.001L169.983 300.001L57.4 235.001V105L169.983 40L282.566 105Z" fill="#FAFF69"/>
      <path d="M198.098 82.8931C199.852 84.177 200.671 86.8134 200.074 89.2541L184.361 153.528H213.355C215.095 153.528 216.669 154.83 217.359 156.841C218.05 158.852 217.725 161.187 216.532 162.782L146.731 256.124C145.34 257.984 143.114 258.391 141.36 257.108C139.607 255.823 138.788 253.187 139.384 250.746L155.097 186.472H126.104C124.363 186.472 122.789 185.17 122.099 183.16C121.408 181.149 121.734 178.814 122.927 177.218L192.728 83.8762C194.118 82.0166 196.344 81.6092 198.098 82.8931Z" fill="#1F1F1C"/>
    </g>
    <text x="380" y="557" text-anchor="start" fill="#FFFFFF" font-size="32" font-weight="600">ClickStack UI</text>
    <text x="730" y="172" text-anchor="start" fill="#A3A3A0" font-size="18">Self-managed</text>
    <text x="730" y="198" text-anchor="start" fill="#A3A3A0" font-size="18">collector</text>
    <text x="470" y="643" fill="#A3A3A0" font-size="20">Hosted in ClickHouse Cloud</text>
  </g>
</svg>

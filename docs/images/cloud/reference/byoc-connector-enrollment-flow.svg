<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d7d7d"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- ===== Boundaries ===== -->
  <rect x="50" y="60" width="570" height="650" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="74" y="96" font-size="16" font-weight="700" fill="#7d7d7d">Your environment</text>

  <rect x="900" y="60" width="370" height="650" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="924" y="96" font-size="16" font-weight="700" fill="#7d7d7d">ClickHouse Cloud</text>

  <!-- ===== Step 1: onboarding (right) ===== -->
  <circle cx="940" cy="150" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="940" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">1</text>
  <rect x="975" y="130" width="260" height="110" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="1105" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Onboarding</text>
  <text x="1105" y="192" text-anchor="middle" font-size="11" fill="#7d7d7d">ClickHouse issues your connector endpoint</text>
  <text x="1105" y="210" text-anchor="middle" font-size="11" fill="#7d7d7d">and a single-use enrollment token</text>

  <!-- Delivery (out of band) -->
  <line x1="975" y1="185" x2="591" y2="185" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-n)"/>
  <text x="783" y="168" text-anchor="middle" font-size="12" font-weight="500" fill="#7d7d7d">endpoint + single-use token</text>
  <text x="783" y="207" text-anchor="middle" font-size="11" fill="#7d7d7d">shared during onboarding</text>

  <!-- ===== Step 2: run init (left) ===== -->
  <circle cx="90" cy="150" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">2</text>
  <rect x="125" y="130" width="460" height="110" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="167" text-anchor="middle" font-size="11" fill="#7d7d7d">You run</text>
  <text x="355" y="193" text-anchor="middle" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">clicklink clctl init --enroll</text>
  <text x="355" y="218" text-anchor="middle" font-size="11" fill="#7d7d7d">paste the token at the hidden prompt</text>

  <line x1="355" y1="240" x2="355" y2="279" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>

  <!-- ===== Step 3: redeem (left) ===== -->
  <circle cx="90" cy="305" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">3</text>
  <rect x="125" y="285" width="460" height="100" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Enrollment token redeemed</text>
  <text x="355" y="346" text-anchor="middle" font-size="11" font-weight="600" fill="#7d7d7d">single use: the token cannot be redeemed twice</text>
  <text x="355" y="364" text-anchor="middle" font-size="11" fill="#7d7d7d">identity material saved as handoff.yaml</text>

  <line x1="355" y1="385" x2="355" y2="424" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>

  <!-- ===== Step 4: keys (left) ===== -->
  <circle cx="90" cy="450" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="455" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">4</text>
  <rect x="125" y="430" width="460" height="110" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Key pair generated locally</text>
  <text x="355" y="500" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e05252">the private key never leaves your environment</text>

  <line x1="355" y1="540" x2="355" y2="579" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>

  <!-- ===== Step 5: deployed (left) ===== -->
  <circle cx="90" cy="605" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="610" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">5</text>
  <rect x="125" y="585" width="460" height="95" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="625" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Connector deployed and verified</text>
  <text x="355" y="649" text-anchor="middle" font-size="11" fill="#7d7d7d">scraper and troubleshooter running, health checks pass</text>

  <!-- ===== Enrollment endpoint (right) ===== -->
  <rect x="975" y="285" width="260" height="255" rx="10" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1105" y="398" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Enrollment endpoint</text>
  <text x="1105" y="422" text-anchor="middle" font-size="11" fill="#7d7d7d">redeems your token, signs your CSR</text>

  <!-- ===== Cross arrows: redeem ===== -->
  <line x1="591" y1="320" x2="969" y2="320" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
  <text x="783" y="303" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">token redeemed once (HTTPS)</text>

  <line x1="969" y1="360" x2="591" y2="360" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-a)"/>
  <text x="783" y="382" text-anchor="middle" font-size="11" fill="#3b82f6">identity material (handoff.yaml)</text>

  <!-- ===== Cross arrows: signing ===== -->
  <line x1="591" y1="465" x2="969" y2="465" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
  <text x="783" y="448" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">CSR only (HTTPS)</text>

  <line x1="969" y1="505" x2="591" y2="505" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-a)"/>
  <text x="783" y="527" text-anchor="middle" font-size="11" fill="#3b82f6">signed certificate</text>

  <!-- ===== Legend ===== -->
  <g>
    <line x1="64" y1="755" x2="112" y2="755" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
    <text x="124" y="759" font-size="12" fill="#7d7d7d">outbound HTTPS from your environment</text>
    <line x1="440" y1="755" x2="488" y2="755" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-a)"/>
    <text x="500" y="759" font-size="12" fill="#7d7d7d">response on the same connection</text>
    <line x1="770" y1="755" x2="818" y2="755" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-n)"/>
    <text x="830" y="759" font-size="12" fill="#7d7d7d">shared out of band, not a network connection</text>
  </g>
</svg>

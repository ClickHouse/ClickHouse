<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 830" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d7d7d"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e05252"/>
    </marker>
  </defs>

  <!-- ===== Boundaries ===== -->
  <rect x="40" y="50" width="740" height="560" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="64" y="86" font-size="16" font-weight="700" fill="#7d7d7d">Your environment</text>

  <rect x="1000" y="50" width="280" height="560" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1024" y="86" font-size="16" font-weight="700" fill="#7d7d7d">ClickHouse Cloud</text>

  <!-- ===== Your operator ===== -->
  <rect x="60" y="195" width="200" height="90" rx="10" fill="#8a8a8a" fill-opacity="0.10" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="160" y="233" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Your operator</text>
  <text x="160" y="255" text-anchor="middle" font-size="11" fill="#7d7d7d">workstation</text>

  <!-- ===== Troubleshooter with session gateway ===== -->
  <rect x="470" y="110" width="290" height="280" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="615" y="147" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Troubleshooter</text>
  <text x="615" y="168" text-anchor="middle" font-size="11" fill="#7d7d7d">runs inside your environment</text>

  <rect x="495" y="195" width="240" height="95" rx="8" fill="#8a8a8a" fill-opacity="0.16" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="615" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#7d7d7d">Session gateway</text>
  <text x="615" y="250" text-anchor="middle" font-size="11" fill="#7d7d7d">enable / disable / status</text>
  <text x="615" y="268" text-anchor="middle" font-size="11" fill="#7d7d7d">sessions expire automatically</text>

  <!-- Operator -> gateway -->
  <line x1="260" y1="240" x2="489" y2="240" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
  <text x="368" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">enable / disable</text>
  <text x="368" y="262" text-anchor="middle" font-size="11" fill="#7d7d7d">identity token + operator allowlist</text>
  <text x="368" y="280" text-anchor="middle" font-size="11" fill="#7d7d7d">fingerprint-pinned TLS on VM</text>

  <!-- ===== Audit log ===== -->
  <rect x="60" y="470" width="280" height="100" rx="10" fill="#8a8a8a" fill-opacity="0.10" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="200" y="505" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Audit log</text>
  <text x="200" y="527" text-anchor="middle" font-size="11" fill="#7d7d7d">gateway calls and troubleshoot commands</text>
  <text x="200" y="546" text-anchor="middle" font-size="11" font-weight="600" fill="#7d7d7d">stays in your environment</text>

  <path d="M540 390 L540 520 L346 520" fill="none" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
  <text x="448" y="507" text-anchor="middle" font-size="11" fill="#7d7d7d">every command recorded</text>

  <!-- ===== Connector API endpoint (cloud) ===== -->
  <rect x="1030" y="270" width="220" height="130" rx="10" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1140" y="330" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Connector API endpoint</text>
  <text x="1140" y="353" text-anchor="middle" font-size="11" fill="#7d7d7d">receives outbound connections only</text>

  <!-- ===== Outbound WebSocket with session gate ===== -->
  <line x1="760" y1="340" x2="886" y2="340" stroke="#3b82f6" stroke-width="1.75"/>
  <circle cx="890" cy="340" r="3.5" fill="#3b82f6"/>
  <line x1="890" y1="340" x2="930" y2="314" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="936" cy="340" r="3.5" fill="#3b82f6"/>
  <line x1="940" y1="340" x2="1024" y2="340" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
  <text x="858" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">outbound WebSocket</text>
  <text x="858" y="298" text-anchor="middle" font-size="11" fill="#3b82f6">mTLS + request signing</text>
  <text x="890" y="372" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3b82f6">closed by default</text>
  <text x="890" y="390" text-anchor="middle" font-size="11" fill="#3b82f6">opens only during an active session</text>

  <!-- Session state controls the gate -->
  <path d="M735 240 L940 240 L940 306" fill="none" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ah-n)"/>
  <text x="845" y="228" text-anchor="middle" font-size="11" fill="#7d7d7d">session state</text>

  <!-- ===== Never inbound ===== -->
  <line x1="1000" y1="490" x2="786" y2="490" stroke="#e05252" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#ah-r)"/>
  <circle cx="893" cy="490" r="12" fill="none" stroke="#e05252" stroke-width="2"/>
  <line x1="884.5" y1="481.5" x2="901.5" y2="498.5" stroke="#e05252" stroke-width="2"/>
  <text x="893" y="525" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e05252">ClickHouse never connects</text>
  <text x="893" y="542" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e05252">into your environment</text>

  <!-- ===== ClickHouse support engineer ===== -->
  <circle cx="1140" cy="680" r="11" fill="none" stroke="#7d7d7d" stroke-width="1.5"/>
  <path d="M1116 712 Q1140 696 1164 712" fill="none" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="1140" y="740" text-anchor="middle" font-size="13" font-weight="600" fill="#7d7d7d">ClickHouse support engineer</text>
  <text x="1140" y="760" text-anchor="middle" font-size="11" fill="#7d7d7d">connects to ClickHouse Cloud only</text>
  <line x1="1140" y1="662" x2="1140" y2="616" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>

  <!-- ===== Legend ===== -->
  <g>
    <line x1="64" y1="795" x2="112" y2="795" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
    <text x="124" y="799" font-size="12" fill="#7d7d7d">outbound, authenticated (mTLS + request signing)</text>
    <line x1="480" y1="795" x2="528" y2="795" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
    <text x="540" y="799" font-size="12" fill="#7d7d7d">local, inside your environment</text>
    <line x1="770" y1="795" x2="818" y2="795" stroke="#e05252" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#ah-r)"/>
    <text x="830" y="799" font-size="12" fill="#7d7d7d">never happens</text>
  </g>
</svg>

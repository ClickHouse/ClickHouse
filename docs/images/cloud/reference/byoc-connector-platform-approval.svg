<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d7d7d"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- ===== Boundaries ===== -->
  <rect x="50" y="60" width="570" height="650" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="74" y="96" font-size="16" font-weight="700" fill="#7d7d7d">Your environment</text>

  <rect x="900" y="60" width="370" height="650" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="924" y="96" font-size="16" font-weight="700" fill="#7d7d7d">ClickHouse Cloud</text>

  <!-- ===== Step 1: proposal (right) ===== -->
  <circle cx="940" cy="150" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="940" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">1</text>
  <rect x="975" y="130" width="260" height="110" rx="10" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1105" y="163" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">ClickHouse proposes</text>
  <text x="1105" y="181" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">a platform update</text>
  <text x="1105" y="203" text-anchor="middle" font-size="11" fill="#7d7d7d">snapshot controller, operator, monitoring</text>
  <text x="1105" y="220" text-anchor="middle" font-size="11" fill="#7d7d7d">sent to the executor as a bundle</text>

  <!-- Proposal delivered over the outbound channel -->
  <line x1="969" y1="195" x2="591" y2="195" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-a)"/>
  <text x="783" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">update proposed</text>
  <text x="783" y="217" text-anchor="middle" font-size="11" fill="#3b82f6">over the WebSocket the executor opened</text>

  <!-- ===== Step 2: approval needed (left) ===== -->
  <circle cx="90" cy="150" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">2</text>
  <rect x="125" y="130" width="460" height="95" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="167" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Executor stages the bundle: approval needed</text>
  <text x="355" y="191" text-anchor="middle" font-size="11" fill="#7d7d7d">nothing is applied until you approve the staged bundle</text>

  <line x1="355" y1="225" x2="355" y2="270" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>

  <!-- ===== Step 3: approve (left) ===== -->
  <circle cx="90" cy="295" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">3</text>
  <rect x="125" y="275" width="460" height="120" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="308" text-anchor="middle" font-size="11" fill="#7d7d7d">You inspect the staged bundle, then run</text>
  <text x="355" y="333" text-anchor="middle" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">clicklink clctl platform approve</text>
  <text x="355" y="357" text-anchor="middle" font-size="11" fill="#7d7d7d">your credentials apply permissions, CRDs and roles</text>
  <text x="355" y="375" text-anchor="middle" font-size="11" fill="#7d7d7d">a 2-hour token is minted</text>

  <!-- The approval stays local (out of band) -->
  <line x1="591" y1="335" x2="690" y2="335" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="785" y="331" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7d7d7d">approval never leaves</text>
  <text x="785" y="348" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7d7d7d">your environment</text>

  <line x1="355" y1="395" x2="355" y2="440" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>

  <!-- ===== Step 4: apply (left) ===== -->
  <circle cx="90" cy="465" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">4</text>
  <rect x="125" y="445" width="460" height="90" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="481" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Executor applies the workloads</text>
  <text x="355" y="501" text-anchor="middle" font-size="11" fill="#7d7d7d">Deployments, Services, ConfigMaps, Secrets, Jobs, PodDisruptionBudgets</text>
  <text x="355" y="517" text-anchor="middle" font-size="11" fill="#7d7d7d">workload objects only, within the approval window</text>

  <line x1="355" y1="535" x2="355" y2="580" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>

  <!-- ===== Step 5: synced (left) ===== -->
  <circle cx="90" cy="605" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="610" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">5</text>
  <rect x="125" y="585" width="460" height="90" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="621" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Reported as synced</text>
  <text x="355" y="645" text-anchor="middle" font-size="11" fill="#7d7d7d">the token expires; the next update needs a new approval</text>

  <!-- ===== Connector API endpoint (right) ===== -->
  <rect x="975" y="575" width="260" height="110" rx="10" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1105" y="621" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Connector API endpoint</text>
  <text x="1105" y="645" text-anchor="middle" font-size="11" fill="#7d7d7d">receives status only</text>

  <!-- ===== Cross arrow: status ===== -->
  <line x1="591" y1="630" x2="969" y2="630" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
  <text x="783" y="613" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">status: synced</text>
  <text x="783" y="652" text-anchor="middle" font-size="11" fill="#3b82f6">over your outbound channel</text>

  <!-- ===== Legend ===== -->
  <g>
    <line x1="64" y1="755" x2="112" y2="755" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
    <text x="124" y="759" font-size="12" fill="#7d7d7d">outbound, authenticated (mTLS + request signing)</text>
    <line x1="490" y1="755" x2="538" y2="755" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-a)"/>
    <text x="550" y="759" font-size="12" fill="#7d7d7d">delivered over the connection you opened</text>
    <line x1="860" y1="755" x2="908" y2="755" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="920" y="759" font-size="12" fill="#7d7d7d">not a network connection</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 610" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d7d7d"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Boundary -->
  <rect x="640" y="50" width="640" height="500" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="664" y="86" font-size="16" font-weight="700" fill="#7d7d7d">Your AWS account</text>

  <!-- Release archive -->
  <rect x="30" y="120" width="220" height="190" rx="10" fill="#8a8a8a" fill-opacity="0.10" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="140" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Release archive</text>
  <rect x="45" y="170" width="190" height="28" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="140" y="189" text-anchor="middle" font-size="12" fill="#7d7d7d">tarball</text>
  <rect x="45" y="204" width="190" height="28" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="140" y="223" text-anchor="middle" font-size="12" fill="#7d7d7d">checksum (.sha256)</text>
  <rect x="45" y="238" width="190" height="28" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="140" y="257" text-anchor="middle" font-size="12" fill="#7d7d7d">signature (.bundle)</text>
  <text x="140" y="292" text-anchor="middle" font-size="11" fill="#7d7d7d">verify with cosign before extracting</text>

  <line x1="250" y1="215" x2="314" y2="215" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
  <text x="282" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">verify</text>
  <text x="282" y="236" text-anchor="middle" font-size="11" fill="#7d7d7d">extract</text>

  <!-- Choose a root -->
  <rect x="320" y="120" width="240" height="190" rx="10" fill="#8a8a8a" fill-opacity="0.10" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="440" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Choose a root</text>
  <rect x="345" y="168" width="190" height="28" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="440" y="187" text-anchor="middle" font-size="12" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">production</text>
  <rect x="345" y="202" width="190" height="28" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="440" y="221" text-anchor="middle" font-size="12" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">minimal</text>
  <rect x="345" y="236" width="190" height="28" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="440" y="255" text-anchor="middle" font-size="12" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">existing-vpc</text>
  <rect x="345" y="270" width="190" height="28" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="440" y="289" text-anchor="middle" font-size="12" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">existing-eks</text>

  <line x1="560" y1="215" x2="664" y2="215" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
  <text x="600" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">configure</text>
  <text x="600" y="236" text-anchor="middle" font-size="11" fill="#7d7d7d">init and plan</text>

  <!-- terraform apply -->
  <rect x="670" y="120" width="580" height="190" rx="10" fill="#8a8a8a" fill-opacity="0.10" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="960" y="152" text-anchor="middle" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">terraform apply</text>
  <text x="960" y="174" text-anchor="middle" font-size="11" fill="#7d7d7d">the roots create the cluster, its system node group, and the managed EKS addons</text>
  <rect x="679" y="192" width="130" height="38" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="744" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">VPC or your VPC</text>
  <rect x="823" y="192" width="130" height="38" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="888" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">EKS cluster</text>
  <rect x="967" y="192" width="130" height="38" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="1032" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">IAM roles</text>
  <rect x="1111" y="192" width="130" height="38" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="1176" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">KMS keys</text>
  <text x="960" y="262" text-anchor="middle" font-size="11" fill="#7d7d7d">existing-vpc and existing-eks add what is missing</text>
  <text x="960" y="280" text-anchor="middle" font-size="11" fill="#7d7d7d">clicklink clctl init then adds the platform layer:</text>
  <text x="960" y="298" text-anchor="middle" font-size="11" fill="#7d7d7d">Karpenter, the load balancer controller, the StorageClass, and the pinned components</text>

  <!-- Outputs written back to your machine -->
  <path d="M710 310 L710 350 L140 350 L140 384" fill="none" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-n)"/>
  <text x="430" y="342" text-anchor="middle" font-size="11" fill="#7d7d7d">terraform output -json &gt; outputs.json</text>

  <!-- outputs.json -->
  <rect x="30" y="390" width="220" height="130" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="140" y="422" text-anchor="middle" font-size="11" fill="#7d7d7d">Local file</text>
  <text x="140" y="448" text-anchor="middle" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">outputs.json</text>
  <text x="140" y="472" text-anchor="middle" font-size="11" fill="#7d7d7d">carries the clicklink output</text>
  <text x="140" y="490" text-anchor="middle" font-size="11" fill="#7d7d7d">same shape from every root</text>

  <line x1="250" y1="455" x2="314" y2="455" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
  <text x="282" y="438" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">hand-off</text>

  <!-- init -->
  <rect x="320" y="390" width="240" height="130" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="440" y="414" text-anchor="middle" font-size="11" fill="#7d7d7d">You run</text>
  <text x="440" y="438" text-anchor="middle" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">clicklink clctl init</text>
  <text x="440" y="458" text-anchor="middle" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">--from-terraform</text>
  <text x="440" y="478" text-anchor="middle" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">--platform-bundle</text>
  <text x="440" y="498" text-anchor="middle" font-size="11" fill="#7d7d7d">Helm: init installs the bundle</text>
  <text x="440" y="512" text-anchor="middle" font-size="11" fill="#7d7d7d">VM: then platform approve --bundle</text>

  <line x1="560" y1="455" x2="664" y2="455" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
  <text x="600" y="438" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">install</text>
  <text x="600" y="478" text-anchor="middle" font-size="11" fill="#7d7d7d">then enroll</text>

  <!-- Connector -->
  <rect x="670" y="390" width="580" height="130" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="960" y="440" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Connector</text>
  <text x="960" y="464" text-anchor="middle" font-size="11" fill="#7d7d7d">running on the EKS cluster</text>
  <text x="960" y="482" text-anchor="middle" font-size="11" fill="#7d7d7d">enrollment continues as in onboarding</text>

  <!-- Legend -->
  <g>
    <line x1="64" y1="580" x2="112" y2="580" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
    <text x="124" y="584" font-size="12" fill="#7d7d7d">hand-off from Terraform to the connector</text>
    <line x1="440" y1="580" x2="488" y2="580" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
    <text x="500" y="584" font-size="12" fill="#7d7d7d">steps you run</text>
    <line x1="660" y1="580" x2="708" y2="580" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-n)"/>
    <text x="720" y="584" font-size="12" fill="#7d7d7d">written to your machine</text>
    <text x="930" y="584" font-size="12" font-weight="600" fill="#7d7d7d">All four roots emit the same clicklink output.</text>
  </g>
</svg>

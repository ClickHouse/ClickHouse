<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 520" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d7d7d"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Boundaries -->
  <rect x="40" y="50" width="580" height="390" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="64" y="86" font-size="16" font-weight="700" fill="#7d7d7d">Your VPC</text>

  <rect x="680" y="50" width="600" height="390" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="704" y="86" font-size="16" font-weight="700" fill="#7d7d7d">ClickHouse Cloud</text>

  <!-- Connector pods -->
  <rect x="60" y="200" width="190" height="120" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="155" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Connector</text>
  <text x="155" y="262" text-anchor="middle" font-size="11" fill="#7d7d7d">pods on your cluster</text>
  <text x="155" y="286" text-anchor="middle" font-size="11" fill="#7d7d7d">resolves both hostnames</text>
  <text x="155" y="302" text-anchor="middle" font-size="11" fill="#7d7d7d">to addresses in the VPC</text>

  <path d="M250 260 L295 260" fill="none" stroke="#7d7d7d" stroke-width="1.75"/>
  <path d="M295 190 L295 330" fill="none" stroke="#7d7d7d" stroke-width="1.75"/>
  <path d="M295 190 L334 190" fill="none" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
  <path d="M295 330 L334 330" fill="none" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
  <text x="295" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">TCP 443</text>

  <!-- Interface endpoints -->
  <rect x="340" y="159" width="240" height="62" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="460" y="179" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">API interface endpoint</text>
  <text x="460" y="196" text-anchor="middle" font-size="11" fill="#7d7d7d">private DNS on</text>
  <text x="460" y="212" text-anchor="middle" font-size="11" fill="#7d7d7d">&lt;subdomain&gt;.&lt;connector-domain&gt;</text>

  <rect x="340" y="299" width="240" height="62" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="460" y="319" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">Enrollment interface endpoint</text>
  <text x="460" y="336" text-anchor="middle" font-size="11" fill="#7d7d7d">private DNS on</text>
  <text x="460" y="352" text-anchor="middle" font-size="11" fill="#7d7d7d">&lt;subdomain&gt;.enroll.&lt;connector-domain&gt;</text>

  <text x="330" y="410" text-anchor="middle" font-size="11" fill="#7d7d7d">Every connection stays outbound.</text>

  <!-- PrivateLink -->
  <line x1="600" y1="190" x2="694" y2="190" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
  <text x="630" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">PrivateLink</text>
  <line x1="600" y1="330" x2="694" y2="330" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
  <text x="630" y="313" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">PrivateLink</text>

  <!-- API side -->
  <rect x="700" y="167" width="150" height="46" rx="8" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.25"/>
  <text x="775" y="186" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">Endpoint service</text>
  <text x="775" y="203" text-anchor="middle" font-size="11" fill="#7d7d7d">requires acceptance</text>
  <line x1="850" y1="190" x2="884" y2="190" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
  <rect x="890" y="167" width="140" height="46" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="960" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">Load balancer</text>
  <line x1="1030" y1="190" x2="1064" y2="190" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
  <rect x="1070" y="167" width="190" height="46" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="1165" y="186" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">API host</text>
  <text x="1165" y="203" text-anchor="middle" font-size="11" fill="#7d7d7d">everything after enrollment</text>

  <!-- Enrollment side -->
  <rect x="700" y="307" width="150" height="46" rx="8" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.25"/>
  <text x="775" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">Endpoint service</text>
  <text x="775" y="343" text-anchor="middle" font-size="11" fill="#7d7d7d">requires acceptance</text>
  <line x1="850" y1="330" x2="884" y2="330" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
  <rect x="890" y="307" width="140" height="46" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="960" y="334" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">Load balancer</text>
  <line x1="1030" y1="330" x2="1064" y2="330" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
  <rect x="1070" y="307" width="190" height="46" rx="8" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.25"/>
  <text x="1165" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#7d7d7d">Enrollment host</text>
  <text x="1165" y="343" text-anchor="middle" font-size="11" fill="#7d7d7d">redeems token, signs certificate</text>

  <text x="980" y="410" text-anchor="middle" font-size="11" fill="#7d7d7d">The endpoints give ClickHouse Cloud no path in.</text>

  <!-- Legend -->
  <g>
    <line x1="64" y1="485" x2="112" y2="485" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
    <text x="124" y="489" font-size="12" fill="#7d7d7d">outbound over an interface endpoint</text>
    <line x1="420" y1="485" x2="468" y2="485" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>
    <text x="480" y="489" font-size="12" fill="#7d7d7d">local hop</text>
    <text x="600" y="489" font-size="12" font-weight="600" fill="#7d7d7d">TLS and mutual TLS still terminate on the ClickHouse side.</text>
  </g>
</svg>

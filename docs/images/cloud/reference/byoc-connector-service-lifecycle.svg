<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 870" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d7d7d"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- ===== Boundaries ===== -->
  <rect x="50" y="60" width="570" height="740" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="74" y="96" font-size="16" font-weight="700" fill="#7d7d7d">Your environment</text>

  <rect x="900" y="60" width="370" height="740" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="924" y="96" font-size="16" font-weight="700" fill="#7d7d7d">ClickHouse Cloud</text>

  <!-- ===== Step 1: prepare (left) ===== -->
  <circle cx="90" cy="150" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">1</text>
  <rect x="125" y="130" width="460" height="95" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="163" text-anchor="middle" font-size="11" fill="#7d7d7d">You run</text>
  <text x="355" y="188" text-anchor="middle" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">clicklink clctl executor prepare</text>
  <text x="355" y="211" text-anchor="middle" font-size="11" fill="#7d7d7d">buckets, IAM role, password shown once</text>

  <line x1="355" y1="225" x2="355" y2="265" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>

  <!-- ===== Step 2: create (left) ===== -->
  <circle cx="90" cy="290" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">2</text>
  <rect x="125" y="270" width="460" height="95" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="303" text-anchor="middle" font-size="11" fill="#7d7d7d">You run</text>
  <text x="355" y="328" text-anchor="middle" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">clicklink clctl instances create --from-prepare</text>
  <text x="355" y="351" text-anchor="middle" font-size="11" fill="#7d7d7d">submitted through your connector endpoint</text>

  <line x1="355" y1="365" x2="355" y2="405" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>

  <!-- ===== Step 3: command delivered (left) ===== -->
  <circle cx="90" cy="430" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">3</text>
  <rect x="125" y="410" width="460" height="90" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="446" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Command delivered over the outbound channel</text>
  <text x="355" y="470" text-anchor="middle" font-size="11" fill="#7d7d7d">WebSocket the executor opened; nothing connects inward</text>

  <line x1="355" y1="500" x2="355" y2="540" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>

  <!-- ===== Step 4: apply (left) ===== -->
  <circle cx="90" cy="565" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="570" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">4</text>
  <rect x="125" y="545" width="460" height="90" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="581" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Executor applies the service definition</text>
  <text x="355" y="605" text-anchor="middle" font-size="11" fill="#7d7d7d">Kubernetes API, service namespace only</text>

  <line x1="355" y1="635" x2="355" y2="675" stroke="#7d7d7d" stroke-width="1.75" marker-end="url(#ah-n)"/>

  <!-- ===== Step 5: status (left) ===== -->
  <circle cx="90" cy="700" r="16" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="90" y="705" text-anchor="middle" font-size="13" font-weight="700" fill="#7d7d7d">5</text>
  <rect x="125" y="680" width="460" height="90" rx="10" fill="#8a8a8a" fill-opacity="0.14" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="355" y="716" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Status reported back</text>
  <text x="355" y="740" text-anchor="middle" font-size="11" fill="#7d7d7d">running once replicas are ready; failures are reported too</text>

  <!-- ===== Connector API endpoint (right) ===== -->
  <rect x="975" y="270" width="260" height="500" rx="10" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1105" y="504" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Connector API endpoint</text>
  <text x="1105" y="528" text-anchor="middle" font-size="11" fill="#7d7d7d">forwards the create to ClickHouse Cloud,</text>
  <text x="1105" y="545" text-anchor="middle" font-size="11" fill="#7d7d7d">which renders the service definition</text>

  <!-- ===== Cross arrows: create ===== -->
  <line x1="591" y1="300" x2="969" y2="300" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
  <text x="783" y="283" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">create request (HTTPS)</text>

  <line x1="969" y1="340" x2="591" y2="340" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-a)"/>
  <text x="783" y="362" text-anchor="middle" font-size="11" fill="#3b82f6">accepted; service name</text>

  <!-- ===== Cross arrow: command ===== -->
  <line x1="969" y1="455" x2="591" y2="455" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-a)"/>
  <text x="783" y="438" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">lifecycle command</text>
  <text x="783" y="477" text-anchor="middle" font-size="11" fill="#3b82f6">over the WebSocket the executor opened</text>

  <!-- ===== Cross arrow: status ===== -->
  <line x1="591" y1="725" x2="969" y2="725" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
  <text x="783" y="708" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">status</text>
  <text x="783" y="747" text-anchor="middle" font-size="11" fill="#3b82f6">running, or the failure reason</text>

  <!-- ===== Legend ===== -->
  <g>
    <line x1="64" y1="845" x2="112" y2="845" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
    <text x="124" y="849" font-size="12" fill="#7d7d7d">outbound from your environment (HTTPS or WebSocket)</text>
    <line x1="480" y1="845" x2="528" y2="845" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-a)"/>
    <text x="540" y="849" font-size="12" fill="#7d7d7d">delivered back over the connection you opened</text>
  </g>
</svg>

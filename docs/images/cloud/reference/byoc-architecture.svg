<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 762" role="img"
     aria-label="BYOC architecture: the ClickHouse control plane in the ClickHouse VPC manages a Kubernetes data plane inside the customer cloud account over a Tailscale tunnel; ClickHouse data, backups and monitoring stay in the customer account, and only bounded telemetry is exported."
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>ClickHouse BYOC architecture</title>
  <desc>Three zones. Left: the ClickHouse VPC control plane (Cloud console and infrastructure management). Centre: the customer cloud account, containing the Customer BYOC VPC with a Kubernetes cluster (ClickHouse services, Kubernetes API server, node pools across three availability zones, monitoring stack) and, outside the VPC, object storage for data parts, backups and archives. Right: users reaching the service over a public endpoint and customer applications reaching it over a private endpoint. A Tailscale zero-trust tunnel, initiated outbound from the customer VPC, carries management traffic and approved engineer access. Three outbound telemetry flows leave the customer account: service and backup state, usage metrics and health alerts.</desc>

  <defs>
    <filter id="sh" x="-6%" y="-10%" width="112%" height="124%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="svcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fbfbfc"/>
    </linearGradient>
    <linearGradient id="chGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf4"/><stop offset="100%" stop-color="#fff3d1"/>
    </linearGradient>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e88e5"/></marker>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#43a047"/></marker>
    <marker id="aH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8e24aa"/></marker>
    <marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#78909c"/></marker>
    <marker id="aNs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#78909c"/></marker>
  </defs>

  <rect width="1280" height="762" fill="#ffffff"/>

  <!-- ============ title ============ -->
  <text x="24" y="44" font-size="16" font-weight="700" fill="#212121">ClickHouse BYOC — control plane and data plane</text>
  <text x="24" y="66" font-size="10.5" fill="#616161">Your ClickHouse data, backups, logs and monitoring data stay in your cloud account. Only bounded operational telemetry is exported.</text>

  <!-- ============ legend ============ -->
  <g font-size="11" fill="#455a64">
    <line x1="1064" y1="40" x2="1098" y2="40" stroke="#1e88e5" stroke-width="1.8" marker-end="url(#aD)"/>
    <text x="1106" y="44">Data &amp; telemetry</text>
    <line x1="1064" y1="64" x2="1098" y2="64" stroke="#43a047" stroke-width="1.8" marker-end="url(#aC)"/>
    <text x="1106" y="68">Control &amp; management</text>
    <line x1="1064" y1="88" x2="1098" y2="88" stroke="#8e24aa" stroke-width="1.8" marker-end="url(#aH)"/>
    <text x="1106" y="92">Engineer &amp; dashboard access</text>
  </g>

  <!-- ============ ClickHouse VPC ============ -->
  <rect x="24" y="106" width="270" height="458" rx="10" fill="#f8f6fd" stroke="#7e57c2" stroke-width="1.6"/>
  <text x="40" y="128" font-size="13" font-weight="600" fill="#5e35b1">ClickHouse VPC — control plane</text>

  <rect x="38" y="136" width="240" height="114" rx="7" fill="#ffffff" stroke="#d1c4e9" stroke-width="1.2"/>
  <text x="58" y="156" font-size="11.5" font-weight="600" fill="#546e7a">ClickHouse Cloud console</text>
  <g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)">
    <rect x="58"  y="164" width="99" height="36" rx="5"/>
    <rect x="161" y="164" width="99" height="36" rx="5"/>
    <rect x="58"  y="206" width="99" height="36" rx="5"/>
    <rect x="161" y="206" width="99" height="36" rx="5"/>
  </g>
  <g font-size="11" fill="#424242" text-anchor="middle">
    <text x="108" y="186">Sign-on &amp; users</text>
    <text x="211" y="186">APIs</text>
    <text x="108" y="228">Monitoring</text>
    <text x="211" y="228">Billing</text>
  </g>

  <rect x="38" y="258" width="240" height="286" rx="7" fill="#ffffff" stroke="#d1c4e9" stroke-width="1.2"/>
  <text x="58" y="278" font-size="11.5" font-weight="600" fill="#546e7a">Infrastructure management</text>
  <g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)">
    <rect x="58" y="285" width="202" height="38" rx="5"/>
    <rect x="58" y="339" width="202" height="38" rx="5"/>
    <rect x="58" y="488" width="202" height="38" rx="5"/>
  </g>
  <rect x="58" y="405" width="202" height="42" rx="5" fill="#f4fbf4" stroke="#81c784" stroke-width="1.3" filter="url(#sh)"/>
  <g font-size="11" fill="#424242" text-anchor="middle">
    <text x="159" y="309">Event queue (SQS / Pub-Sub)</text>
    <text x="159" y="363">Usage metering &amp; billing</text>
    <text x="159" y="512">Alerting &amp; on-call</text>
    <text x="159" y="424" font-size="11.5" font-weight="600" fill="#2e7d32">BYOC controller</text>
    <text x="159" y="438" font-size="9" fill="#558b2f">provisions infra · applies service state</text>
  </g>

  <!-- ============ Tailscale tunnel ============ -->
  <rect x="296" y="372" width="172" height="100" rx="12" fill="#eceff1" stroke="#43a047" stroke-width="1.6"/>
  <g>
    <text x="306" y="392" font-size="10.5" font-weight="600" fill="#37474f">Kubernetes API</text>
    <text x="306" y="406" font-size="10.5" font-weight="600" fill="#37474f">private connection</text>
    <text x="306" y="426" font-size="10" fill="#546e7a">AWS · VPC Lattice (optional)</text>
    <text x="306" y="442" font-size="10" fill="#546e7a">GCP · GKE DNS endpoint</text>
    <text x="306" y="458" font-size="10" fill="#546e7a">Azure · Private Link</text>
  </g>

  <rect x="292" y="576" width="156" height="64" rx="12" fill="#eceff1" stroke="#8e24aa" stroke-width="1.6"/>
  <g text-anchor="middle">
    <text x="370" y="598" font-size="10.5" font-weight="600" fill="#37474f">Tailscale</text>
    <text x="370" y="613" font-size="9" fill="#546e7a">zero-trust tunnel</text>
    <text x="370" y="628" font-size="9" fill="#546e7a">metrics · dashboards</text>
  </g>

  <!-- ============ Customer cloud account ============ -->
  <rect x="470" y="106" width="540" height="636" rx="10" fill="#f3fbfa" stroke="#26a69a" stroke-width="1.8"/>
  <text x="486" y="130" font-size="13" font-weight="600" fill="#00695c">Your cloud account — AWS account / GCP project / Azure subscription</text>

  <rect x="484" y="144" width="512" height="438" rx="8" fill="#f6faff" stroke="#42a5f5" stroke-width="1.5"/>
  <text x="498" y="168" font-size="12" font-weight="600" fill="#1565c0">Customer BYOC VPC</text>

  <rect x="496" y="180" width="488" height="386" rx="8" fill="#f9f9fe" stroke="#5c6bc0" stroke-width="1.4"/>
  <text x="510" y="200" font-size="12" font-weight="600" fill="#3949ab">Kubernetes cluster — EKS / GKE / AKS</text>

  <rect x="508" y="206" width="464" height="188" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
  <text x="520" y="224" font-size="11.5" font-weight="600" fill="#546e7a">ClickHouse services</text>
  <g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)">
    <rect x="520" y="232" width="126" height="36" rx="5"/>
    <rect x="520" y="286" width="126" height="36" rx="5"/>
    <rect x="520" y="340" width="126" height="36" rx="5"/>
    <rect x="826" y="232" width="134" height="36" rx="5"/>
    <rect x="826" y="286" width="134" height="36" rx="5"/>
    <rect x="826" y="340" width="134" height="36" rx="5"/>
  </g>
  <g font-size="11" fill="#424242" text-anchor="middle">
    <text x="583" y="254">ClickHouse operator</text>
    <text x="583" y="308">State exporter</text>
    <text x="583" y="362">Scraper</text>
    <text x="893" y="254">Istio ingress</text>
    <text x="893" y="308">External DNS</text>
    <text x="893" y="362">Cert manager</text>
  </g>
  <rect x="658" y="232" width="156" height="144" rx="7" fill="url(#chGrad)" stroke="#ffb300" stroke-width="1.6" filter="url(#sh)"/>
  <g text-anchor="middle">
    <text x="736" y="288" font-size="12.5" font-weight="600" fill="#6d4c00">ClickHouse cluster</text>
    <text x="736" y="306" font-size="9.5" fill="#8d6e00">servers + Keeper</text>
    <text x="736" y="322" font-size="9.5" fill="#8d6e00">your data stays here</text>
  </g>

  <g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)">
    <rect x="508" y="406" width="200" height="40" rx="5"/>
    <rect x="720" y="406" width="252" height="40" rx="5"/>
  </g>
  <g fill="#424242" text-anchor="middle">
    <text x="608" y="431" font-size="11">Kubernetes API server</text>
    <text x="846" y="431" font-size="10.5">Node pools across 3 availability zones</text>
  </g>

  <rect x="508" y="458" width="464" height="92" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
  <text x="520" y="476" font-size="11.5" font-weight="600" fill="#546e7a">Monitoring stack</text>
  <g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)">
    <rect x="520" y="486" width="104" height="42" rx="5"/>
    <rect x="636" y="486" width="104" height="42" rx="5"/>
    <rect x="752" y="486" width="104" height="42" rx="5"/>
    <rect x="868" y="486" width="104" height="42" rx="5"/>
  </g>
  <g font-size="11" fill="#424242" text-anchor="middle">
    <text x="572" y="512">Prometheus</text>
    <text x="688" y="512">Grafana</text>
    <text x="804" y="512">AlertManager</text>
    <text x="920" y="512">Thanos</text>
  </g>
  <text x="520" y="544" font-size="9.5" fill="#78909c">Metrics, logs and alerts are produced and retained in your account</text>

  <rect x="484" y="612" width="512" height="100" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
  <text x="498" y="634" font-size="11.5" font-weight="600" fill="#546e7a">Object storage (S3 / GCS / Azure Blob) — outside the VPC</text>
  <g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)">
    <rect x="498" y="646" width="152" height="46" rx="5"/>
    <rect x="664" y="646" width="152" height="46" rx="5"/>
    <rect x="830" y="646" width="152" height="46" rx="5"/>
  </g>
  <g font-size="11" fill="#424242" text-anchor="middle">
    <text x="574" y="674">Data parts</text>
    <text x="740" y="674">Backups</text>
    <text x="906" y="674">Metrics &amp; log archive</text>
  </g>

  <!-- ============ users / customer VPC ============ -->
  <text x="1160" y="126" font-size="11" fill="#455a64" text-anchor="middle">Users &amp; BI tools</text>
  <g transform="translate(1140,136)">
    <circle cx="20" cy="12" r="9" fill="none" stroke="#546e7a" stroke-width="1.4"/>
    <path d="M6,44 Q20,28 34,44" fill="none" stroke="#546e7a" stroke-width="1.4"/>
  </g>

  <rect x="1070" y="300" width="190" height="180" rx="8" fill="#fafafa" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="1082" y="322" font-size="12" font-weight="600" fill="#455a64">Customer VPC</text>
  <g fill="url(#svcGrad)" stroke="#bdbdbd" stroke-width="1" filter="url(#sh)">
    <rect x="1082" y="332" width="166" height="34" rx="5"/>
    <rect x="1082" y="374" width="166" height="34" rx="5"/>
    <rect x="1082" y="416" width="166" height="34" rx="5"/>
  </g>
  <g font-size="11" fill="#424242" text-anchor="middle">
    <text x="1165" y="354">Applications</text>
    <text x="1165" y="396">VMs / instances</text>
    <text x="1165" y="438">Pods</text>
    <text x="1165" y="466" font-size="12" fill="#9e9e9e">…</text>
  </g>

  <!-- peering -->
  <line x1="1014" y1="424" x2="1066" y2="424" stroke="#78909c" stroke-width="1.5" marker-end="url(#aN)" marker-start="url(#aNs)"/>
  <text x="1040" y="414" font-size="9" fill="#546e7a" text-anchor="middle">VPC peering</text>

  <!-- ============ flows: data &amp; telemetry ============ -->
  <g stroke="#1e88e5" stroke-width="1.7" fill="none">
    <line x1="520" y1="304" x2="266" y2="304" marker-end="url(#aD)"/>
    <line x1="520" y1="358" x2="266" y2="358" marker-end="url(#aD)"/>
    <line x1="508" y1="507" x2="266" y2="507" marker-end="url(#aD)"/>
    <polyline points="100,526 100,610 128,610" marker-end="url(#aD)"/>
    <polyline points="736,376 736,400 978,400 978,600 574,600"/>
    <line x1="574" y1="600" x2="574" y2="608" marker-end="url(#aD)"/>
    <polyline points="1160,186 1160,240 964,240" marker-end="url(#aD)"/>
    <polyline points="1070,349 1042,349 1042,258 964,258" marker-end="url(#aD)"/>
  </g>
  <g font-size="10.5" fill="#1565c0" text-anchor="middle">
    <text x="382" y="296">service &amp; backup state</text>
    <text x="382" y="350">usage metrics</text>
    <text x="404" y="501" text-anchor="end">health alerts</text>
    <text x="790" y="592" font-size="9.5">writes data parts &amp; backups</text>
    <text x="114" y="560" font-size="9.5" text-anchor="start">page</text>
  </g>
  <g font-size="10.5" fill="#1565c0" text-anchor="end">
    <text x="1150" y="222">Public endpoint</text>
    <text x="1150" y="234" font-size="9.5">HTTPS / native protocol</text>
    <text x="1150" y="268">Private endpoint</text>
    <text x="1150" y="280" font-size="8.5">AWS PrivateLink · GCP PSC</text>
    <text x="1150" y="291" font-size="8.5">Azure Private Link</text>
  </g>

  <!-- ============ flows: control ============ -->
  <g stroke="#43a047" stroke-width="1.7" fill="none">
    <polyline points="47,250 47,426 54,426" marker-end="url(#aC)"/>
    <line x1="260" y1="426" x2="292" y2="426" marker-end="url(#aC)"/>
    <line x1="468" y1="426" x2="504" y2="426" marker-end="url(#aC)"/>
  </g>

  <!-- ============ flows: engineer access (bridged over the alerts line) ============ -->
  <line x1="448" y1="507" x2="464" y2="507" stroke="#ffffff" stroke-width="5"/>
  <g stroke="#8e24aa" stroke-width="1.7" fill="none">
    <line x1="172" y1="612" x2="288" y2="612" marker-end="url(#aH)"/>
    <polyline points="448,612 456,612 456,486 503,486" marker-end="url(#aH)"/>
  </g>
  <g font-size="9.5" fill="#6a1b9a" text-anchor="middle">
    <text x="370" y="658">read-only: monitoring &amp; system tables</text>
    <text x="370" y="670">approved · time-bound · audited</text>
  </g>

  <!-- ClickHouse engineers -->
  <g transform="translate(134,592)">
    <circle cx="20" cy="10" r="9" fill="none" stroke="#546e7a" stroke-width="1.4"/>
    <path d="M6,40 Q20,24 34,40" fill="none" stroke="#546e7a" stroke-width="1.4"/>
  </g>
  <text x="154" y="650" font-size="11" fill="#455a64" text-anchor="middle">ClickHouse engineers</text>
</svg>

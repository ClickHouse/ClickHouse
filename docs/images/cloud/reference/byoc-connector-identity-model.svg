<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 700" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d7d7d"/>
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e05252"/>
    </marker>
  </defs>

  <!-- ===== Boundaries ===== -->
  <rect x="40" y="50" width="750" height="560" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="64" y="86" font-size="16" font-weight="700" fill="#7d7d7d">Your environment</text>

  <rect x="1000" y="50" width="280" height="560" rx="14" fill="#8a8a8a" fill-opacity="0.06" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1024" y="86" font-size="16" font-weight="700" fill="#7d7d7d">ClickHouse Cloud</text>

  <!-- ===== Per-service cloud role ===== -->
  <rect x="60" y="175" width="200" height="220" rx="10" fill="#8a8a8a" fill-opacity="0.10" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="160" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Per-service cloud role</text>
  <text x="160" y="227" text-anchor="middle" font-size="11" fill="#7d7d7d">one IAM role per service</text>
  <text x="160" y="257" text-anchor="middle" font-size="11" fill="#7d7d7d">created by prepare</text>
  <text x="160" y="273" text-anchor="middle" font-size="11" fill="#7d7d7d">with your credentials</text>
  <text x="160" y="299" text-anchor="middle" font-size="11" fill="#7d7d7d">read/write to that</text>
  <text x="160" y="315" text-anchor="middle" font-size="11" fill="#7d7d7d">service's buckets only</text>
  <text x="160" y="341" text-anchor="middle" font-size="11" fill="#7d7d7d">assumed only by</text>
  <text x="160" y="357" text-anchor="middle" font-size="11" fill="#7d7d7d">the service's pods</text>

  <!-- ===== Connector ===== -->
  <rect x="280" y="100" width="490" height="450" rx="12" fill="#8a8a8a" fill-opacity="0.05" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="525" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Connector</text>
  <text x="525" y="149" text-anchor="middle" font-size="11" fill="#7d7d7d">runs inside your environment</text>

  <!-- Executor identity -->
  <rect x="300" y="175" width="220" height="220" rx="10" fill="#8a8a8a" fill-opacity="0.10" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="410" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Executor identity</text>
  <text x="410" y="228" text-anchor="middle" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">pcm-executor</text>
  <text x="410" y="257" text-anchor="middle" font-size="11" fill="#7d7d7d">Kubernetes ServiceAccount</text>
  <text x="410" y="283" text-anchor="middle" font-size="11" fill="#7d7d7d">writes confined to service</text>
  <text x="410" y="299" text-anchor="middle" font-size="11" fill="#7d7d7d">namespaces by an admission policy</text>
  <text x="410" y="325" text-anchor="middle" font-size="11" fill="#7d7d7d">read access to workload state</text>

  <!-- Platform identity -->
  <rect x="540" y="175" width="220" height="220" rx="10" fill="#8a8a8a" fill-opacity="0.10" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="650" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Platform identity</text>
  <text x="650" y="228" text-anchor="middle" font-size="13.5" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#7d7d7d">pcm-platform</text>
  <text x="650" y="257" text-anchor="middle" font-size="11" fill="#7d7d7d">created by your approval</text>
  <text x="650" y="283" text-anchor="middle" font-size="11" fill="#7d7d7d">2-hour token</text>
  <text x="650" y="309" text-anchor="middle" font-size="11" fill="#7d7d7d">writes confined to</text>
  <text x="650" y="325" text-anchor="middle" font-size="11" fill="#7d7d7d">platform namespaces</text>
  <text x="650" y="351" text-anchor="middle" font-size="11" fill="#7d7d7d">never renewed</text>

  <!-- Read-only components -->
  <rect x="300" y="425" width="460" height="95" rx="10" fill="#8a8a8a" fill-opacity="0.10" stroke="#7d7d7d" stroke-width="1.5"/>
  <text x="530" y="460" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Read-only components</text>
  <text x="530" y="482" text-anchor="middle" font-size="11" fill="#7d7d7d">Scraper and troubleshooter: read-only ClickHouse users,</text>
  <text x="530" y="498" text-anchor="middle" font-size="11" fill="#7d7d7d">namespace-scoped read RBAC</text>

  <!-- ===== Connector API endpoint (cloud) ===== -->
  <rect x="1030" y="220" width="220" height="140" rx="10" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1140" y="285" text-anchor="middle" font-size="14" font-weight="600" fill="#7d7d7d">Connector API endpoint</text>
  <text x="1140" y="308" text-anchor="middle" font-size="11" fill="#7d7d7d">receives outbound connections only</text>

  <!-- ===== Outbound arrow (accent) ===== -->
  <line x1="770" y1="290" x2="1024" y2="290" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
  <text x="897" y="273" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">commands and status</text>
  <text x="897" y="310" text-anchor="middle" font-size="11" fill="#3b82f6">mTLS + request signing</text>

  <!-- ===== Never inbound ===== -->
  <line x1="1000" y1="460" x2="796" y2="460" stroke="#e05252" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#ah-r)"/>
  <circle cx="898" cy="460" r="12" fill="none" stroke="#e05252" stroke-width="2"/>
  <line x1="889.5" y1="451.5" x2="906.5" y2="468.5" stroke="#e05252" stroke-width="2"/>
  <text x="898" y="495" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e05252">ClickHouse holds</text>
  <text x="898" y="512" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e05252">no cloud credentials</text>
  <text x="898" y="529" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e05252">and never connects inward</text>

  <!-- ===== Legend ===== -->
  <g>
    <line x1="64" y1="655" x2="112" y2="655" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#ah-a)"/>
    <text x="124" y="659" font-size="12" fill="#7d7d7d">outbound, authenticated (mTLS + request signing)</text>
    <line x1="480" y1="655" x2="528" y2="655" stroke="#e05252" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#ah-r)"/>
    <text x="540" y="659" font-size="12" fill="#7d7d7d">never happens</text>
    <text x="700" y="659" font-size="12" font-weight="600" fill="#7d7d7d">All connections are initiated from your environment.</text>
  </g>
</svg>

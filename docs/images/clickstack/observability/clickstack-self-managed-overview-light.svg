<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Self-managed ClickHouse Observability</title>
  <desc id="desc">Your app SDKs, collectors, and log shippers send telemetry to an OpenTelemetry collector that you operate, which writes to ClickHouse services in ClickHouse Cloud. ClickHouse Cloud hosts the ClickStack UI and manages infrastructure, upgrades, and backups, while you manage ingestion, schemas, compute, and performance tuning.</desc>

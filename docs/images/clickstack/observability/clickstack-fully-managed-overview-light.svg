  <text x="606" y="198" fill="#3F3F2E" font-size="10.5" font-weight="400" text-anchor="start">Sized to the</text>
  <text x="606" y="211" fill="#3F3F2E" font-size="10.5" font-weight="400" text-anchor="start">workload,</text>
  <text x="606" y="224" fill="#3F3F2E" font-size="10.5" font-weight="400" text-anchor="start">monitored, and</text>

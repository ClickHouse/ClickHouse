<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Fully managed ClickHouse Observability</title>
  <desc id="desc">Your app SDKs, collectors, and log shippers send telemetry to managed OTLP and Datadog endpoints. ClickHouse Observability provides the ClickStack UI and handles schema optimization, workload isolation, and automatic scaling, so ingestion, schemas, compute, and performance are managed for you.</desc>

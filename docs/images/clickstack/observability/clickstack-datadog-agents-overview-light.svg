<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Datadog Agents sending to ClickHouse Observability</title>
  <desc id="desc">Datadog Agents on hosts, Kubernetes clusters, and containers stay unchanged. They send logs, traces, and metrics to the Datadog-compatible endpoint of ClickHouse Observability on port 8126, which feeds the ClickStack UI. Optionally they keep sending to Datadog while you compare both platforms.</desc>

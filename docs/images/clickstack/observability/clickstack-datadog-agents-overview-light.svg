  <rect x="28" y="156" width="24" height="24" rx="6" fill="#ECECE8" stroke="none" stroke-width="1"/>
  <text x="40" y="171.1" fill="#1C1C1C" font-size="8.9" font-weight="700" text-anchor="middle">DD</text>
  <text x="64" y="172.7" fill="#1C1C1C" font-size="13" font-weight="500" text-anchor="start">Kubernetes clusters</text>
  <rect x="16" y="204" width="232" height="48" rx="8" fill="#FFFFFF" stroke="#D9D9D5" stroke-width="1"/>

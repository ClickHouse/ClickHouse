[package]
workspace = "../rust-contrib-workspace"
name = "_ch_rust_delta_kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ideally we would disable all features to remove dependencies but:
# * default-engine: Needed for its s3 client (we can't pass our own s3 client via ffi)
delta_kernel_ffi = { path = "../delta-kernel-rs/ffi", default-features = false, features = ["default-engine-native-tls", "test-ffi", "tracing", "arrow"] }

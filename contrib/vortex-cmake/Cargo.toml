[package]
workspace = "../rust-contrib-workspace"
edition = "2021"
name = "_ch_rust_vortex"
version = "0.1.0"

[dependencies]
# Has to stay whatever version `vortex` itself pulls in, or Arrow data would need converting on the
# way between the two crates.
arrow-array = "58.4.0"
arrow-schema = "58.4.0"
# The building blocks of the host-driven runtime (see `HostRuntime` in `src/lib.rs`): the tasks the
# host runs on its own threads, the queues they wait in, and the parking of a thread that drives the
# runtime itself. All of them are dependencies of `vortex` already.
async-task = "4.7"
concurrent-queue = "2"
futures = "0.3"
parking = "2"
# The same MPMC channel `vortex-io` uses; the scan hands its chunks to any number of consumer
# threads through it. `std-mutex`: a thread waiting on a contended channel parks. kanal's default
# lock only spins, and under TSan its unlock can starve behind the spinners (Cargo applies the
# feature to every user of the crate).
kanal = { version = "0.1", features = ["std-mutex"] }
# Vortex checks the zone of a timestamp with `jiff`, which on Linux only reads the host's time zone
# database. Without one, as in a container built from `scratch`, every zone but `UTC` is unknown
# and a file with such a column cannot be read. The bundled copy is used only when the host has no
# database. Same version as `vortex` uses, so that the feature applies to its copy.
jiff = { version = "0.2.46", default-features = false, features = ["tzdb-bundle-always"] }
vortex = { version = "0.84.0", default-features = false, features = ["files", "zstd"] }

[build-dependencies]
# Generates `include/vortex_ffi.h`, see `build.rs`. Pinned exactly: cbindgen formats differently
# between patch versions, and the version has to be one `contrib/rust_vendor` carries. Its default
# features are only needed by the command-line tool.
cbindgen = { version = "=0.29.2", default-features = false }

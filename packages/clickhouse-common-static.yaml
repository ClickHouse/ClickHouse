# build-dir should be a link to the build directory
# nfpm should run from the same directory with a config
name: "clickhouse-common-static"
description: |
  Common files for ClickHouse
    ClickHouse is a column-oriented database management system
    that allows generating analytical data reports in real time.
    This package provides common files for both clickhouse server and client

# Common packages config
arch: "${DEB_ARCH}" # amd64, arm64
platform: "linux"
version: "${CLICKHOUSE_VERSION_STRING}"
vendor: "ClickHouse Inc."
homepage: "https://clickhouse.com"
license: "Apache"
section: "database"
priority: "optional"
maintainer: "ClickHouse Dev Team <packages+linux@clickhouse.com>"
deb:
  fields:
    Source: clickhouse

# Package specific content
replaces:
- clickhouse-common
- clickhouse-server-base
provides:
- clickhouse-common
- clickhouse-server-base
suggests:
- clickhouse-common-static-dbg

contents:
- src: build-dir/programs/stripped/bin/clickhouse
  dst: /usr/bin/clickhouse
  file_info:
    mode: 0755
- src: clickhouse
  dst: /usr/bin/clickhouse-extract-from-config
  type: symlink
- src: ../programs/bash-completion/completions/clickhouse*
  dst: /usr/share/bash-completion/completions
  file_info:
    mode: 0644
# well-known Protobuf types, found by the server through `google_protos_path`
- src: "../contrib/google-protobuf/src/google/protobuf/{any,api,descriptor,duration,empty,field_mask,source_context,struct,timestamp,type,wrappers}.proto"
  dst: /usr/share/clickhouse/protos/google/protobuf
  file_info:
    mode: 0644
# docs
- src: ../AUTHORS
  dst: /usr/share/doc/clickhouse-common-static/AUTHORS
- src: ../CHANGELOG.md
  dst: /usr/share/doc/clickhouse-common-static/CHANGELOG.md
- src: ../LICENSE
  dst: /usr/share/doc/clickhouse-common-static/LICENSE
- src: ../README.md
  dst: /usr/share/doc/clickhouse-common-static/README.md

name: Merge current master for PR 112808

on:
  push:
    branches: [agent/refreshable-mv-workload]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refreshable-mv-workload
          fetch-depth: 1
      - name: Merge current master
        if: ${{ github.event.head_commit.message == 'Execute PR 112808 master merge helper' }}
        run: bash .github/scripts/merge-pr112808-master.sh

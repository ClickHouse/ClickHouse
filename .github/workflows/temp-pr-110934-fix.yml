name: temp-pr-110934-fix

on:
  push:
    branches:
      - agent/exponential-time-decayed-aggregates

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exponential-time-decayed-aggregates
          fetch-depth: 1
          sparse-checkout: |
            src/Interpreters/parseColumnsListForTableFunction.cpp
          sparse-checkout-cone-mode: false
      - name: Fix formatting
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/Interpreters/parseColumnsListForTableFunction.cpp')
          text = path.read_text()
          old = '''        if (!settings.allow_experimental_time_decay_aggregate_functions)
          {
              bool is_experimental_time_decay_type = isExponentialTimeDecayingFloat64(data_type);
              if (const auto * aggregate_function_type = typeid_cast<const DataTypeAggregateFunction *>(&data_type))
                  is_experimental_time_decay_type
                      |= AggregateFunctionFactory::instance().hasExecutionAvailabilityCheck(
                          aggregate_function_type->getFunctionName());

              if (is_experimental_time_decay_type)
                  throw Exception(
                      ErrorCodes::ILLEGAL_COLUMN,
                      "Cannot create column with type '{}' because exponential time decay aggregate functions are experimental. "
                      "Set setting allow_experimental_time_decay_aggregate_functions = 1 in order to allow them",
                      data_type.getName());
          }

          '''
          new = '''        if (!settings.allow_experimental_time_decay_aggregate_functions)
        {
            bool is_experimental_time_decay_type = isExponentialTimeDecayingFloat64(data_type);
            if (const auto * aggregate_function_type = typeid_cast<const DataTypeAggregateFunction *>(&data_type))
                is_experimental_time_decay_type
                    |= AggregateFunctionFactory::instance().hasExecutionAvailabilityCheck(
                        aggregate_function_type->getFunctionName());

            if (is_experimental_time_decay_type)
                throw Exception(
                    ErrorCodes::ILLEGAL_COLUMN,
                    "Cannot create column with type '{}' because exponential time decay aggregate functions are experimental. "
                    "Set setting allow_experimental_time_decay_aggregate_functions = 1 in order to allow them",
                    data_type.getName());
        }

        '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one malformed block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/Interpreters/parseColumnsListForTableFunction.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Interpreters/parseColumnsListForTableFunction.cpp
          git commit -m 'Format time-decay type validation after master sync'
          git push origin HEAD:agent/exponential-time-decayed-aggregates

name: temp-pr-110934-oracle-fix

on:
  push:
    branches:
      - agent/exponential-time-decayed-aggregates

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exponential-time-decayed-aggregates
          fetch-depth: 1
          sparse-checkout: |
            tests/queries/0_stateless/04614_exponential_time_decay_oracle.sql
            tests/queries/0_stateless/04614_exponential_time_decay_oracle.reference
            .github/workflows/temp-pr-110934-oracle-fix.yml
          sparse-checkout-cone-mode: false
      - name: Fix oracle expectation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          sql_path = Path('tests/queries/0_stateless/04614_exponential_time_decay_oracle.sql')
          sql = sql_path.read_text()
          old = '''-- Materialized views historically skip unrelated suspicious-type validation.
-- Adding the time-decay gate must not change that behavior.
CREATE MATERIALIZED VIEW time_decay_mv_unrelated_validation
(
    value LowCardinality(UInt64)
)
ENGINE = Memory
AS SELECT toUInt64(1) AS value;
SELECT 'unrelated materialized view validation preserved';
DROP TABLE time_decay_mv_unrelated_validation;
'''
          new = '''-- The materialized view itself skips storage-specific validation, but its
-- internal target table is real storage and must retain upstream validation.
CREATE MATERIALIZED VIEW time_decay_mv_unrelated_validation
(
    value LowCardinality(UInt64)
)
ENGINE = Memory
AS SELECT toUInt64(1) AS value; -- { serverError SUSPICIOUS_TYPE_FOR_LOW_CARDINALITY }
'''
          if sql.count(old) != 1:
              raise SystemExit(f'expected one oracle block, found {sql.count(old)}')
          sql_path.write_text(sql.replace(old, new, 1))

          ref_path = Path('tests/queries/0_stateless/04614_exponential_time_decay_oracle.reference')
          ref = ref_path.read_text()
          marker = 'unrelated materialized view validation preserved\n'
          if ref.count(marker) != 1:
              raise SystemExit(f'expected one reference marker, found {ref.count(marker)}')
          ref_path.write_text(ref.replace(marker, '', 1))
          PY
          rm .github/workflows/temp-pr-110934-oracle-fix.yml
          git diff --check
          git diff -- tests/queries/0_stateless/04614_exponential_time_decay_oracle.sql tests/queries/0_stateless/04614_exponential_time_decay_oracle.reference
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/queries/0_stateless/04614_exponential_time_decay_oracle.sql tests/queries/0_stateless/04614_exponential_time_decay_oracle.reference .github/workflows/temp-pr-110934-oracle-fix.yml
          git commit -m 'Fix materialized view validation oracle after master sync'
          git push origin HEAD:agent/exponential-time-decayed-aggregates

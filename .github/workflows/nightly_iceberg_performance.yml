# generated by praktika

name: NightlyIcebergPerformance
on:
  schedule:
    - cron: 13 1 * * *
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

env:
  PYTHONUNBUFFERED: 1
  CHECKOUT_REF: ""


jobs:


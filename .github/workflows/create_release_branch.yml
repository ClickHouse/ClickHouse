# generated by praktika

name: CreateReleaseBranch
concurrency:
  group: ${{ github.workflow }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git reference (branch or commit SHA) to cut the new release branch from
        required: true
        default: ''
      dry-run:
        description: Dry run — show what would be done without making changes
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Git reference (branch or commit SHA) to cut the new release branch from
        required: true
        type: string
        default: ''
      dry-run:
        description: Dry run — show what would be done without making changes
        required: false
        type: boolean
        default: false
    secrets:
      ROBOT_CLICKHOUSE_COMMIT_TOKEN:
        required: true

env:
  PYTHONUNBUFFERED: 1
  CHECKOUT_REF: ""
  ROBOT_CLICKHOUSE_COMMIT_TOKEN: ${{ secrets.ROBOT_CLICKHOUSE_COMMIT_TOKEN }}

# Allow updating GH commit statuses and PR comments to post an actual job reports link
permissions: write-all

jobs:

  createreleasebranch:
    runs-on: [self-hosted, amd-release-maker]
    needs: []
    name: "CreateReleaseBranch"
    outputs:
      data: ${{ steps.run.outputs.DATA }}
      pipeline_status: ${{ steps.run.outputs.pipeline_status || 'undefined' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Prepare env script
        run: |
          rm -rf ./ci/tmp
          mkdir -p ./ci/tmp
          cat > ./ci/tmp/praktika_setup_env.sh << 'ENV_SETUP_SCRIPT_EOF'
          export PYTHONPATH=./ci:.:
          export ROBOT_CLICKHOUSE_COMMIT_TOKEN=$(cat<<'EOF'
          ${{ secrets.ROBOT_CLICKHOUSE_COMMIT_TOKEN }}
          EOF
          )
          cat > ./ci/tmp/workflow_inputs.json << 'EOF'
          ${{ toJson(inputs) }}
          EOF
          cat > ./ci/tmp/workflow_job.json << 'EOF'
          ${{ toJson(job) }}
          EOF
          cat > ./ci/tmp/workflow_status.json << 'EOF'
          ${{ toJson(needs) }}
          EOF
          ENV_SETUP_SCRIPT_EOF

      - name: Run
        id: run
        run: |
          . ./ci/tmp/praktika_setup_env.sh
          PYTHONUNBUFFERED=1 python3 -m praktika run 'CreateReleaseBranch' --workflow "CreateReleaseBranch" --ci --timestamp

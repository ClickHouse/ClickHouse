name: Apply PR 112808 review fixes

on:
  push:
    branches:
      - agent/refreshable-mv-workload

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'vanchaklar/ClickHouse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name clickhouse-gh
          git config user.email clickhouse-gh@users.noreply.github.com
          python3 .github/scripts/apply-pr112808-review-fixes.py
          git diff --check
          paths=(
            src/Interpreters/ProcessList.h
            src/Interpreters/ProcessList.cpp
            src/Storages/StorageMaterializedView.cpp
            src/Storages/MaterializedView/RefreshTask.cpp
            tests/integration/test_refreshable_mv_query_slots/test.py
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'Review fixes already applied.'
            exit 0
          fi
          git add "${paths[@]}"
          git diff --cached --check
          git commit -m 'Address RMV workload admission review feedback'
          git push origin HEAD:agent/refreshable-mv-workload

name: Scheduled Altinity Builds

on:
  schedule:
    - cron: '0 0 * * 6' #Weekly run for stable versions 
  # Make sure that any changes to this file is actually tested with PRs
  pull_request:
    types:
      - synchronize
      - reopened
      - opened
    paths:
      - '**/scheduled_runs.yml'

jobs:
  DailyRuns:
    strategy:
      fail-fast: false
      matrix:
        branch: 
          - antalya-26.6
          - antalya-26.3
          - antalya-25.8
    name: ${{ matrix.branch }}
    runs-on: ubuntu-latest
    steps:
     - name: Run ${{ matrix.branch }} workflow
       run: |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/Altinity/ClickHouse/actions/workflows/release_branches.yml/dispatches \
          -d '{"ref":"${{ matrix.branch }}"}'

  WeeklyRuns:
    strategy:
      fail-fast: false
      matrix:
        branch: 
          - stable-26.3
          - stable-25.8
          - releases/24.8.14
    name: ${{ matrix.branch }}
    runs-on: ubuntu-latest
    steps:
     - name: Run ${{ matrix.branch }} workflow
       run: |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/Altinity/ClickHouse/actions/workflows/release_branches.yml/dispatches \
          -d '{"ref":"${{ matrix.branch }}"}'

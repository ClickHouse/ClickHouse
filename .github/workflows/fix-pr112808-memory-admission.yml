name: Fix PR 112808 memory admission

on:
  push:
    branches: [agent/refreshable-mv-workload]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refreshable-mv-workload
          fetch-depth: 1
      - name: Apply focused fix
        if: ${{ github.event.head_commit.message == 'Run RMV memory admission fixer' }}
        run: python3 .github/scripts/fix-pr112808-memory-admission.py
      - name: Commit focused fix
        if: ${{ github.event.head_commit.message == 'Run RMV memory admission fixer' }}
        run: |
          git diff --check
          git status --short
          git config user.name clickhouse-gh
          git config user.email clickhouse-gh@users.noreply.github.com
          git add src/Common/Scheduler/MemoryReservation.h src/Common/Scheduler/MemoryReservation.cpp src/Interpreters/ProcessList.h src/Interpreters/ProcessList.cpp src/Storages/MaterializedView/RefreshTask.h src/Storages/MaterializedView/RefreshTask.cpp tests/integration/test_refreshable_mv_query_slots/test.py
          git commit -m "Make RMV memory admission cancellable"
          git push origin HEAD:agent/refreshable-mv-workload

name: Weekly Cloud Unsupported Features

on: # yamllint disable-line rule:truthy
  schedule:
    # Every Monday at 08:17 UTC.
    - cron: '17 8 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-cloud-unsupported-features
  cancel-in-progress: false

jobs:
  update-cloud-unsupported-features:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: ClickHouse/checkout@v1
        with:
          token: ${{ secrets.ROBOT_CLICKHOUSE_COMMIT_TOKEN }}
          fetch-depth: 0

      - name: Generate unsupported feature list
        id: generate
        run: |
          python3 ci/jobs/scripts/docs/generate_cloud_unsupported_features.py --write
          if git diff --quiet -- docs/products/cloud/guides/cloud-compatibility.mdx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh pull request
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ROBOT_CLICKHOUSE_COMMIT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Refusing to update the bot branch from $GITHUB_REF"
            exit 1
          fi

          git fetch --no-tags origin master
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]]; then
            echo "Refusing to update the bot branch from a stale master commit"
            exit 1
          fi

          branch="robot/cloud-unsupported-features"
          title="Docs: refresh unsupported ClickHouse Cloud features"

          git config user.name "clickhouse-robot-gh"
          git config user.email "clickhouse-robot-gh@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs/products/cloud/guides/cloud-compatibility.mdx
          git commit -m "$title"
          git push origin "HEAD:refs/heads/$branch" --force

          pr=$(gh pr list \
            --repo "$GH_REPO" \
            --head "$branch" \
            --base master \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" \
              --repo "$GH_REPO" \
              --add-label pr-autogenerated-docs
            exit 0
          fi

          body=$(cat <<'EOF'
          This pull request is opened automatically by the weekly documentation workflow.
          It refreshes the list of documentation pages and sections marked as unsupported
          in ClickHouse Cloud.

          Generated by `ci/jobs/scripts/docs/generate_cloud_unsupported_features.py`.

          ### Changelog category (leave one):
          - Documentation (changelog entry is not required)

          ### Changelog entry (a [user-readable short description](https://github.com/ClickHouse/ClickHouse/blob/master/docs/changelog_entry_guidelines.md) of the changes that goes into CHANGELOG.md):
          Refresh the list of features unsupported in ClickHouse Cloud.

          Related: https://github.com/ClickHouse/ClickHouse/issues/112856
          EOF
          )

          gh pr create \
            --repo "$GH_REPO" \
            --head "$branch" \
            --base master \
            --title "$title" \
            --body "$body" \
            --label pr-autogenerated-docs

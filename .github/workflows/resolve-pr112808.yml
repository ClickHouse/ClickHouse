name: Resolve PR 112808

on:
  push:
    branches:
      - agent/refreshable-mv-workload

permissions:
  contents: write

jobs:
  resolve-merge:
    if: github.repository == 'vanchaklar/ClickHouse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/resolve-pr112808.yml
            .github/scripts/resolve-pr112808.py
            src/Core/Settings.cpp
            src/Core/SettingsChangesHistory.cpp
            src/Storages/MaterializedView/RefreshTask.cpp
            src/Storages/MaterializedView/RefreshTask.h
            src/Storages/StorageMaterializedView.cpp
            src/Storages/StorageMaterializedView.h
      - name: Resolve upstream conflicts on the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name clickhouse-gh
          git config user.email clickhouse-gh@users.noreply.github.com
          git remote add upstream https://github.com/ClickHouse/ClickHouse.git || true

          head=$(git rev-parse HEAD)
          git fetch --no-tags --filter=blob:none --depth=1 upstream master
          master=$(git rev-parse FETCH_HEAD)
          merge_base=79305ee77d5b450e827ac16ea1126701c3b076f2
          git fetch --no-tags --filter=blob:none --depth=1 upstream "$merge_base"

          head_tree=$(git rev-parse "$head^{tree}")
          master_tree=$(git rev-parse "$master^{tree}")
          synthetic_head=$(printf 'synthetic branch ancestry\n' | git commit-tree "$head_tree" -p "$merge_base")
          synthetic_master=$(printf 'synthetic master ancestry\n' | git commit-tree "$master_tree" -p "$merge_base")
          git replace "$head" "$synthetic_head"
          git replace "$master" "$synthetic_master"
          if [[ -f .git/shallow ]]; then
            grep -v -e "^${head}$" -e "^${master}$" .git/shallow > .git/shallow.next || true
            mv .git/shallow.next .git/shallow
          fi
          test "$(git merge-base "$head" "$master")" = "$merge_base"

          set +e
          git merge --no-commit --no-ff "$master"
          merge_rc=$?
          set -e

          expected=(src/Core/Settings.cpp src/Core/SettingsChangesHistory.cpp src/Storages/MaterializedView/RefreshTask.cpp src/Storages/MaterializedView/RefreshTask.h src/Storages/StorageMaterializedView.cpp src/Storages/StorageMaterializedView.h)
          if (( merge_rc != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "$(printf '%s\n' "${conflicts[@]}" | sort)" != "$(printf '%s\n' "${expected[@]}" | sort)" ]]; then
              printf 'Unexpected conflicts:\n%s\n' "${conflicts[*]}" >&2
              exit 1
            fi
            git checkout --theirs -- "${expected[@]}"
          fi

          python3 .github/scripts/resolve-pr112808.py
          git add "${expected[@]}"
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' "${expected[@]}"
          git diff --check

          # Keep the correctly resolved file contents, but do not import 4,804 unrelated master
          # commits (including workflow changes the Actions token is not allowed to push).
          tar -cf /tmp/rmv-resolved.tar "${expected[@]}"
          git merge --abort
          if [[ -f .git/shallow ]]; then
            printf '%s\n' "$head" >> .git/shallow
            sort -u -o .git/shallow .git/shallow
          fi
          git replace -d "$head" "$master"
          tar -xf /tmp/rmv-resolved.tar
          git add "${expected[@]}"

          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case " ${expected[*]} " in
              *" $path "*) ;;
              *) echo "Unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --cached --check
          git commit -m 'Resolve RMV workload conflicts with upstream master'
          resolved=$(git rev-parse HEAD)
          mapfile -t parents < <(git cat-file -p "$resolved" | sed -n 's/^parent //p')
          test "${#parents[@]}" -eq 1
          test "${parents[0]}" = "$head"
          git push origin HEAD:agent/refreshable-mv-workload

name: Resolve PR 112808

on:
  push:
    branches:
      - agent/refreshable-mv-workload

permissions:
  contents: write

jobs:
  resolve-merge:
    if: github.repository == 'vanchaklar/ClickHouse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Merge upstream master and resolve RMV workload conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'clickhouse-gh'
          git config user.email 'clickhouse-gh@users.noreply.github.com'
          git remote add upstream https://github.com/ClickHouse/ClickHouse.git || true
          git fetch --no-tags --filter=blob:none upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'upstream/master is already merged'
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff upstream/master
          merge_rc=$?
          set -e

          expected=(
            src/Core/Settings.cpp
            src/Core/SettingsChangesHistory.cpp
            src/Storages/MaterializedView/RefreshTask.cpp
            src/Storages/MaterializedView/RefreshTask.h
            src/Storages/StorageMaterializedView.cpp
            src/Storages/StorageMaterializedView.h
          )

          if (( merge_rc != 0 )); then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'conflicts:\n'; printf '  %s\n' "${conflicts[@]}"
            if [[ "$(printf '%s\n' "${conflicts[@]}" | sort)" != "$(printf '%s\n' "${expected[@]}" | sort)" ]]; then
              echo 'Unexpected conflict set; refusing an unsafe resolution.' >&2
              exit 1
            fi
            git checkout --theirs -- "${expected[@]}"
          fi

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise RuntimeError(f"{path}: expected one match, found {n}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != expected:
                  raise RuntimeError(f"{path}: expected {expected} matches, found {n}: {old[:100]!r}")
              p.write_text(s.replace(old, new))


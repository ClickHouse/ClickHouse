# generated by praktika

name: DebugPush
concurrency:
  group: ${{ github.workflow }}
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Target repository for the probe push (default: this repo)
        required: false
        default: ''
      probe-branch:
        description: Throwaway branch to create and delete for the probe
        required: false
        default: robot-clickhouse/debug-push-probe
  workflow_call:
    inputs:
      repo:
        description: Target repository for the probe push (default: this repo)
        required: false
        type: string
        default: ''
      probe-branch:
        description: Throwaway branch to create and delete for the probe
        required: false
        type: string
        default: robot-clickhouse/debug-push-probe

env:
  PYTHONUNBUFFERED: 1
  CHECKOUT_REF: ""

# Allow updating GH commit statuses and PR comments to post an actual job reports link
permissions: write-all

jobs:

  debugpush:
    runs-on: [self-hosted, amd-release-maker]
    needs: []
    name: "DebugPush"
    outputs:
      data: ${{ steps.run.outputs.DATA }}
      pipeline_status: ${{ steps.run.outputs.pipeline_status || 'undefined' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Prepare env script
        run: |
          rm -rf ./ci/tmp
          mkdir -p ./ci/tmp
          cat > ./ci/tmp/praktika_setup_env.sh << 'ENV_SETUP_SCRIPT_EOF'
          export PYTHONPATH=./ci:.:
          cat > ./ci/tmp/workflow_inputs.json << 'EOF'
          ${{ toJson(inputs) }}
          EOF
          cat > ./ci/tmp/workflow_job.json << 'EOF'
          ${{ toJson(job) }}
          EOF
          cat > ./ci/tmp/workflow_status.json << 'EOF'
          ${{ toJson(needs) }}
          EOF
          ENV_SETUP_SCRIPT_EOF

      - name: Run
        id: run
        run: |
          . ./ci/tmp/praktika_setup_env.sh
          PYTHONUNBUFFERED=1 python3 -m praktika run 'DebugPush' --workflow "DebugPush" --ci --timestamp

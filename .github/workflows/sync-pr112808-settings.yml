name: Sync PR 112808 settings

on:
  push:
    branches:
      - agent/refreshable-mv-workload

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'vanchaklar/ClickHouse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/sync-pr112808-settings.py
            .github/workflows/sync-pr112808-settings.yml
            src/Core/Settings.cpp
            src/Core/SettingsChangesHistory.cpp
      - name: Sync settings files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name clickhouse-gh
          git config user.email clickhouse-gh@users.noreply.github.com
          git remote add upstream https://github.com/ClickHouse/ClickHouse.git || true
          git fetch --no-tags --filter=blob:none --depth=1 upstream master
          git checkout FETCH_HEAD -- src/Core/Settings.cpp src/Core/SettingsChangesHistory.cpp
          python3 .github/scripts/sync-pr112808-settings.py
          git diff --check
          if git diff --quiet -- src/Core/Settings.cpp src/Core/SettingsChangesHistory.cpp; then
            echo 'Settings already match current master plus PR additions.'
            exit 0
          fi
          git add src/Core/Settings.cpp src/Core/SettingsChangesHistory.cpp
          git diff --cached --check
          git commit -m 'Sync RMV workload settings with current master'
          git push origin HEAD:agent/refreshable-mv-workload

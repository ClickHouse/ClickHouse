openSSL:
  server:
    certificateFile: '/etc/clickhouse-server/config.d/WithoutPassPhrase.crt'
    privateKeyFile: '/etc/clickhouse-server/config.d/WithoutPassPhrase.key'
    caConfig: '/etc/clickhouse-server/config.d/rootCA.pem'
    loadDefaultCAFile: true
    verificationMode: 'none'
    cacheSessions: true
    disableProtocols: 'sslv2,sslv3'
    preferServerCiphers: true
    # Names no suite OpenSSL recognizes, so the TLS 1.3 suite list selects nothing.
    # Unlike a cipher list, that has no legitimate reading and must be rejected.
    cipherSuites: 'TLS_NOT_A_REAL_SUITE'
  client:
    certificateFile: '/etc/clickhouse-server/config.d/WithoutPassPhrase.crt'
    caConfig: '/etc/clickhouse-server/config.d/rootCA.pem'
    loadDefaultCAFile: true
    verificationMode: 'relaxed'
    cacheSessions: true
    disableProtocols: 'sslv2,sslv3'
    preferServerCiphers: true

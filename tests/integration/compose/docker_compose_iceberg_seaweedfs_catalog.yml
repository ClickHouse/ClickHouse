services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mkdir -p /data /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<'EOF'
        {
          "identities": [
            {
              "name": "clickhouse",
              "credentials": [{"accessKey": "clickhouse", "secretKey": "clickhouse"}],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        # admin.port + 10000 is the derived admin gRPC port; it must stay below the
        # 32768 ephemeral floor, or an outbound dial can take it before admin binds it.
        exec weed mini -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -tableBucket=analytics -admin.port=12646
    ports:
      - "${ICEBERG_REST_CATALOG_PORT}:8181"
    healthcheck:
      test: ["CMD-SHELL", "nc -w2 -z localhost 8333 && nc -w2 -z localhost 8181"]
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 10s
    cpus: 3

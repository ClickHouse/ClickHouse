services:
  minio1:
    # Mirror of pgsty/minio:RELEASE.2026-08-04T00-00-00Z (see compose/mirror-images.sh).
    # pgsty/minio is a maintained community fork of MinIO, published on Docker Hub, which
    # replaced the deleted minio/minio repository; we re-host it under clickhouse/ so pulls
    # go through the dockerhub-proxy cache and survive the upstream repo disappearing.
    image: clickhouse/minio-minio:RELEASE.2026-08-04T00-00-00Z
    volumes:
      - data1-1:/data1
      - ${MINIO_CERTS_DIR:-}:/certs
    expose:
      - ${MINIO_PORT:-9001}
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ClickHouse_Minio_P@ssw0rd
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server --console-address 127.0.0.1:19001 --address :9001 --certs-dir /certs /data1-1
    depends_on:
      - proxy1
      - proxy2
    networks:
      default:
        aliases:
          - warehouse.minio
    stop_grace_period: 5s
    cpus: 3
  # HTTP proxies for Minio.
  proxy1:
    stop_grace_period: 5s
    image: clickhouse/s3-proxy:${DOCKER_S3_PROXY_TAG:-latest}
    expose:
      - "8080" # Redirect proxy port
      - "80"   # Reverse proxy port
      - "443"  # Reverse proxy port (secure)
    cpus: 3

  proxy2:
    stop_grace_period: 5s
    image: clickhouse/s3-proxy:${DOCKER_S3_PROXY_TAG:-latest}
    expose:
      - "8080"
      - "80"
      - "443"
    cpus: 3

  # Empty container to run proxy resolver.
  resolver:
    stop_grace_period: 5s
    image: clickhouse/python-bottle:${DOCKER_PYTHON_BOTTLE_TAG:-latest}
    expose:
      - "8080"
    tty: true
    depends_on:
      - proxy1
      - proxy2
    volumes:
      - type: ${RESOLVER_LOGS_FS:-tmpfs}
        source: ${RESOLVER_LOGS:-}
        target: /var/log/resolver
    cpus: 3

volumes:
  data1-1:

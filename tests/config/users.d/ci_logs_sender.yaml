profiles:
    ci_logs_sender:
        # The async sends will block the table shutdown for the timeout,
        # and default timeout of 300 seconds is too big and may lead to hangs,
        # the INSERTs will be retried anyway
        send_timeout: 15
        receive_timeout: 15
        # Enable async INSERT, to reduce amount of parts
        async_insert: 1
        wait_for_async_insert: 0
        async_insert_busy_timeout_min_ms: 1000
        async_insert_busy_timeout_max_ms: 5000
        # Avoid polluting caches
        enable_filesystem_cache_on_write_operations: 0
        write_through_distributed_cache: 0
        # Override local default limit of 32G
        max_memory_usage_for_user: 0
        # Force INSERT in background
        distributed_foreground_insert: 0
        # Without the readonly constraints the settings of the query that
        # triggers the DEFINER = ci_logs_sender views (e.g. 32G for
        # max_memory_usage_for_user from the CI default profile) override the
        # profile values and are sent to the ci-logs cluster with the INSERTs.
        constraints:
            send_timeout:
                readonly: true
            receive_timeout:
                readonly: true
            async_insert:
                readonly: true
            wait_for_async_insert:
                readonly: true
            async_insert_busy_timeout_min_ms:
                readonly: true
            async_insert_busy_timeout_max_ms:
                readonly: true
            enable_filesystem_cache_on_write_operations:
                readonly: true
            write_through_distributed_cache:
                readonly: true
            max_memory_usage_for_user:
                readonly: true
            distributed_foreground_insert:
                readonly: true
users:
    ci_logs_sender:
        profile: ci_logs_sender
        # Nobody ever authenticates as this user: it only exists as the DEFINER
        # of the `<table>_watcher` views, so the hash below is random and there
        # is no password that matches it. It is not `no_password`, because a
        # server started with `allow_no_password: 0` refuses to parse a users
        # config that defines such a user (`UsersConfigParser.cpp`,
        # `Authentication type no_password is not allowed`), and the export
        # installs this file on servers of the tests that set it, e.g.
        # tests/integration/test_no_password_existing_user.
        password_sha256_hex: "a25c4b2ecd6f5f8bc9f3b06fb4dd41c6338c76f1d8fe1cd1d0e0ee0bcbaef0dd"
        networks:
            ip:
            - ::1
            - 127.0.0.1

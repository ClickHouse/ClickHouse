version: 1
# ─── Registry saturation ──────────────────────────────────────────────────────
# How many sessions and watches can a resource-constrained keeper sustain when
# serving a service-discovery registry, and what degrades first?
#
# The workload statistically approximates the classic ZooKeeper registry
# pattern: N clients each hold one session with a children-watch on a shared
# registry path and read the member entries; membership churn fires the
# children-watch on every watcher simultaneously, and a steady list weight
# stands in for the clients' re-list + watch re-arm reaction (keeper-bench
# generates requests independently rather than reactively; see
# workloads/registry_watch.yaml).
#
# All scenarios pin keeper containers to a small deployment shape
# (opts: cpu_limit 4 / mem_limit 4g) so the results answer "what fits on a
# constrained keeper" rather than "what fits on the CI host".
#
# The session ladder (c500 → c12000) keeps the workload mix constant and raises
# only workload.clients (sessions; also the worker count unless
# workload.concurrency decouples them, as the c12000 rung does).  Gates get
# progressively looser at higher rungs on purpose: the upper rungs are for
# observing where degradation starts (mntr session/watch counts, container
# CPU/memory, p99), not for a hard pass/fail.  Above 4000 sessions the harness
# transparently shards the bench across multiple subprocesses (see
# workloads/keeper_bench.py).
#
# All scenarios pin backend: default (via defaults below): workload.clients
# only maps to real sessions on the default backend (the ZooKeeper bench path
# collapses to a single connection), and the cpu/mem/pids/max_connections opts
# only shape default-backend containers — on any other backend the same
# scenario id would run a materially different workload.
#
# Watch gating: gates run after the bench, when sessions — and every watch they
# held — are already gone, so post-run watch counts (deltas, residuals,
# per-node hotspot shares) carry no signal and are not asserted.  Instead the
# in-run metrics sampler records the peak cluster-wide zk_watch_count and each
# scenario asserts a conservative floor on it (watch_peak_ge).  Note the armed
# population does NOT approach the session count: keeper watches are one-shot,
# so every churn op fires and clears ALL children-watches on the registry path
# and a session only re-arms on its next list — the instantaneous armed count
# is bounded by the list:churn mix ratio (roughly ten lists between fire
# events), independent of sessions (c500 sampled a peak of 65).  Floors are
# therefore mix-derived and deliberately loose: they prove the workload really
# arms watches without flaking on churn timing.
#
# These scenarios are on-demand (not part of the nightly scenario files); run
# them with KEEPER_SCENARIO_FILES=registry_saturation.yaml or -k '<id>'.
defaults:
  duration: 300
  topology: 3
  backend: default
scenarios:
# ─── Session ladder ───────────────────────────────────────────────────────────
- id: registry-sat-c500
  name: Registry saturation (500 sessions)
  description: Registry watch mix with 500 sessions across 3 nodes. Ladder rung 1; expected healthy.
  workload:
    config: workloads/registry_watch.yaml
    clients: 500
  opts:
    cpu_limit: 4
    mem_limit: 4g
  pre:
  - kind: ensure_paths
    'on': leader
    paths:
    - /registry
    - /registry/servers
  faults: []
  gates:
  - type: single_leader
  - type: error_rate_le
  - type: p99_le
  - type: watch_peak_ge
    min_watches: 10  # mix-derived floor: mean armed ≈ 12 (list:churn 60:5); c500 sampled a peak of 65
  - type: log_sanity_ok
  - type: print_summary
  - type: mntr_print
- id: registry-sat-c1000
  name: Registry saturation (1000 sessions)
  description: Registry watch mix with 1000 sessions across 3 nodes. Ladder rung 2.
  workload:
    config: workloads/registry_watch.yaml
    clients: 1000
  opts:
    cpu_limit: 4
    mem_limit: 4g
  pre:
  - kind: ensure_paths
    'on': leader
    paths:
    - /registry
    - /registry/servers
  faults: []
  gates:
  - type: single_leader
  - type: error_rate_le
  - type: p99_le
  - type: watch_peak_ge
    min_watches: 10  # mix-derived floor; armed count tracks the mix ratio, not sessions
  - type: log_sanity_ok
  - type: print_summary
  - type: mntr_print
- id: registry-sat-c2000
  name: Registry saturation (2000 sessions)
  description: Registry watch mix with 2000 sessions across 3 nodes. Ladder rung 3; relaxed gates, watch for degradation onset.
  workload:
    config: workloads/registry_watch.yaml
    clients: 2000
  opts:
    cpu_limit: 4
    mem_limit: 4g
  pre:
  - kind: ensure_paths
    'on': leader
    paths:
    - /registry
    - /registry/servers
  faults: []
  gates:
  - type: single_leader
  - type: error_rate_le
    max_ratio: 0.2
  - type: p99_le
    max_ms: 20000
  - type: watch_peak_ge
    min_watches: 10  # mix-derived floor; armed count tracks the mix ratio, not sessions
  - type: log_sanity_ok
  - type: print_summary
  - type: mntr_print
- id: registry-sat-c4000
  name: Registry saturation (4000 sessions)
  description: Registry watch mix with 4000 sessions across 3 nodes. Ladder rung 4; loose gates, primarily observational. Check host ulimit -n first (each session is one TCP connection from the bench host).
  workload:
    config: workloads/registry_watch.yaml
    clients: 4000
  opts:
    cpu_limit: 4
    mem_limit: 4g
  pre:
  - kind: ensure_paths
    'on': leader
    paths:
    - /registry
    - /registry/servers
  faults: []
  gates:
  - type: single_leader
  - type: error_rate_le
    max_ratio: 0.3
  - type: p99_le
    max_ms: 30000
  - type: watch_peak_ge
    min_watches: 10  # mix-derived floor; armed count tracks the mix ratio, not sessions
  - type: log_sanity_ok
  - type: print_summary
  - type: mntr_print
- id: registry-sat-c12000
  name: Registry saturation (12000 sessions)
  description: Registry watch mix with 12000 sessions across 3 nodes (4k per node), run as 3 sharded bench processes with 120 decoupled workers total (workload.concurrency). Ladder rung 5; purely observational. Bench host needs ~25k threads (2 per session, mind systemd TasksMax as well as ulimit -u) and >12k fds. Nodes need max_connections and pids_limit raised (one connection = one server thread) and more memory than the lower rungs — thousands of server threads plus session/watch tracking OOM a 4g node. At 8k connections per node (24000 sessions) this hardware profile saturates outright — four-letter-word probes stop answering and error rates explode — so this rung sits just below that knee.
  duration: 600
  workload:
    config: workloads/registry_watch.yaml
    clients: 12000
    concurrency: 120
  opts:
    cpu_limit: 4
    mem_limit: 12g
    pids_limit: 30000
    max_connections: 20000
  pre:
  - kind: ensure_paths
    'on': leader
    paths:
    - /registry
    - /registry/servers
  faults: []
  gates:
  - type: single_leader
  - type: error_rate_le
    max_ratio: 0.5
  - type: watch_peak_ge
    min_watches: 10  # mix-derived floor; armed count tracks the mix ratio, not sessions
  - type: log_sanity_ok
  - type: print_summary
  - type: mntr_print
# ─── Watch churn ──────────────────────────────────────────────────────────────
- id: registry-watch-churn
  name: Registry watch churn (1000 sessions)
  description: ~1000 sessions each arm a one-shot children-watch on a shared registry path via list; a low-rate writer continuously fires and clears them, and sessions re-arm on their next list. The steady-state armed population is bounded by the list:create mix ratio (~2 dozen), not the session count. Measures sustained watch arm/fire/notify/re-arm cycling and notification delivery under load.
  workload:
    config: workloads/registry_churn.yaml
    clients: 1000
  opts:
    cpu_limit: 4
    mem_limit: 4g
  pre:
  - kind: ensure_paths
    'on': leader
    paths:
    - /registry
    - /registry/servers
  faults: []
  gates:
  - type: single_leader
  - type: error_rate_le
  - type: p99_le
  - type: watch_peak_ge
    min_watches: 15  # mix-derived floor: mean armed ≈ 23 (list:create 70:3); watches are one-shot, so armed count never approaches the session count
  - type: watches_fired_ge
    min_fired: 100  # a fire needs an armed watch + a successful create + a delivered notification, and each create fires ALL armed children-watches (~2 dozen), so a healthy 300 s run fires thousands; this floor proves the churn cycle ran without flaking on timing
  - type: log_sanity_ok
  - type: print_summary
  - type: mntr_print
# ─── Session expiry storm ─────────────────────────────────────────────────────
# Runs only with --faults.  The registry workload uses a 30 s client session
# timeout; CPU starvation on all (already 4-CPU-pinned) nodes degrades keeper
# enough for sessions to start expiring, then load returns to normal.  A single
# cpu_hog is one busy-loop (one core), which a 4-CPU container shrugs off — so
# run four in parallel per node to contend the full pinned CPU budget.
# Answers: how does the error window look when an overloaded keeper causes
# mass session expiry among watchers?  Gates assert only survival and the
# error-window bound; watch arming is proven for the healthy phase, and
# post-storm session/watch recovery is observed via mntr_print/print_summary
# output, not gated.  No p99 gate — tail latency is unbounded under CPU
# starvation by design.
- id: registry-expiry-storm
  name: 'Registry expiry storm [fault: cpu_hog all]'
  description: Registry watch mix (1000 sessions, 30 s session timeout) with CPU saturation (4 parallel hogs per node) on all nodes driving session expiry. Observational — gates assert only survival and the error window; post-storm recovery is read from mntr_print/print_summary output, not gated. Error gate relaxed, no p99 gate.
  workload:
    config: workloads/registry_watch.yaml
    clients: 1000
  opts:
    cpu_limit: 4
    mem_limit: 4g
  pre:
  - kind: ensure_paths
    'on': leader
    paths:
    - /registry
    - /registry/servers
  faults:
  - kind: parallel
    steps:
    - kind: cpu_hog
      'on': all
      seconds: 120
      target_parallel: true
    - kind: cpu_hog
      'on': all
      seconds: 120
      target_parallel: true
    - kind: cpu_hog
      'on': all
      seconds: 120
      target_parallel: true
    - kind: cpu_hog
      'on': all
      seconds: 120
      target_parallel: true
  gates:
  - type: single_leader
  - type: error_rate_le
    max_ratio: 0.5
  - type: watch_peak_ge
    min_watches: 10  # mix-derived floor on the whole-run peak; the healthy pre-storm phase alone satisfies it
  - type: log_sanity_ok
  - type: print_summary
  - type: mntr_print
